paths:
  dataset_snapshot: output/SWE-bench_Verified/gepa-pilot-datasets/pilot_2_2_seed43_e2bdb83dc201
  initial_rules: configs/archive/offline_gepa/gepa_initial_rules_gpt_seed.md
  run_dir: /tmp/gepa-rules-stub-run-openai

checker:
  model: openai/deepseek-v4-flash
  api_base: http://127.0.0.1:18080
  api_key_env: FAKE_LLM_API_KEY
  temperature: 0.0
  max_steps: 20
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 1

reflection:
  model: openai/deepseek-v4-flash
  api_base: http://127.0.0.1:18080
  api_key_env: FAKE_LLM_API_KEY
  temperature: 0.0
  max_steps: 20
  cost_limit: 0.0
  timeout: 1800

search:
  max_metric_calls: 6
  projection_metric_calls: 6
  reflection_minibatch_size: 1
  parallel: 1
  seed: 42
  skip_perfect_score: false
  min_proposals: 1

docker:
  workdir: /testbed
  timeout: 30
  min_free_gb: 20
  max_cached_images: 6

prompts:
  checker_system: |
    You are a rule-bound binary classifier.

    Decide whether the supplied plan should be predicted resolved.

    Use the candidate rules as the only decision criteria.
    Use the issue, plan, and repository only as evidence for applying those rules.
    Do not add criteria that are not stated in the candidate rules.

    If the candidate rules do not clearly support predicting resolved, predict unresolved.

    Write exactly this JSON schema to /tmp/gepa_checker_result.json using:
    cat <<'EOF' > /tmp/gepa_checker_result.json
    {
      "predicted_resolved": false,
      "decision_reason": "...",
      "repository_evidence": [
        {"path": "...", "symbol": "...", "finding": "..."}
      ]
    }
    EOF
    After the file is written, your NEXT response must be exactly one bash
    block containing:
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/gepa_checker_result.json
    Do not run any other command after submitting.
  checker_instance: |
    <issue>
    {{task}}
    </issue>
    <plan>
    {{plan}}
    </plan>
    <candidate_rules>
    {{candidate_rules}}
    </candidate_rules>
  reflection_system: |
    You optimize the complete rule text used by a fixed Checker Agent.
    Read the files under {{evidence_path}} to diagnose classification errors.
    Produce a complete replacement rule text.
    Write it to /tmp/candidate_rules.txt, then run:
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/candidate_rules.txt
  reflection_instance: |
    <current_rules>
    {{current_rules}}
    </current_rules>
    Evidence for the current minibatch is mounted read-only at
    {{evidence_path}}. Inspect it as needed and produce improved complete rules.
