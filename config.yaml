# Plan-Code-Test runtime configuration
system:
  n: 1
  optimization_info_level: 1
  model: deepseek-v4-flash
  api_base: "https://api.deepseek.com"

  # Hugging Face dataset name passed to the loader.
  # Phase 1 -> SWE-bench/SWE-bench_Verified (default).
  # Phase 2 -> AmazonScience/SWE-PolyBench.
  # PolyBench -> AmazonScience/SWE-PolyBench.
  # Single run only ever reads one dataset; instance IDs below are interpreted
  # within this dataset.
  dataset: "AmazonScience/SWE-PolyBench"

  # Explicit dataset type hint. When empty, the type is inferred from the
  # dataset name. Supported values: "swebench" | "polybench" | "pro".
  # Example for PolyBench: dataset_type: "polybench"
  dataset_type: "polybench"

  # Language filter for multi-language datasets (e.g. PolyBench).
  # Only instances where "language" matches this value are loaded.
  # Example: language_filter: "Python"
  language_filter: "Python"

  # Folder segment between dataset and instance in the output tree:
  #   output/<dataset_short>/<batch_id>/<instance>/...
  # Required (FatalError if empty). Use a descriptive name that captures
  # the experimental intent of the run, e.g.:
  #   early_test                 — smoke / dry-run before a real batch
  #   run1, run2, run3           — sequentially numbered exploration runs
  #   run3_level1_n3_on_run1     — variation on existing sample set
  # Allowed characters: [A-Za-z0-9_.-]. CLI flag --batch-id overrides this value.
