  validation_instance_ids:
    - pair-27786b755371198326783156
    - pair-05a1e7405702ab648b7f67ea

models:
  checker: {model: deepseek-v4-flash, temperature: 0.0}
  reflector: {model: deepseek-v4-flash, temperature: 0.0}
  curator: {model: deepseek-v4-flash, temperature: 0.0}
  refiner: {model: deepseek-v4-flash, temperature: 0.0}

repo_checker:
  workdir: /testbed
  command_timeout_seconds: 1800
  source_access_policy: conservative_blacklist_v3
  prune_future_history: true
  masked_container_paths:
    - /opt/miniconda3/pkgs

scoring:
  correct_order: 1
  inverted: -1
  tied: 0
  invalid: -100

search:
  max_iterations: 1
  reflection_minibatch_size: 2
  max_metric_calls: 16
  seed: 42
  perfect_score: 1.0
  skip_perfect_score: true

reflection:
  rounds: 1
  evidence_image: python:3.12-slim
  evidence_sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  command_timeout_seconds: 1800

length:
  maximum_visible_tokens: 2048
  maximum_bullet_tokens: 64
  harmful_pruning_weight: 2

budget:
  candidate_proposals: 1
  reflection_pairs_per_proposal: 2
  checker_agents_per_pair_evaluation: 2
  reflection_rounds_per_pair: 1
  projected_pair_metric_call_ceiling: 16

stopping:
  stop_after_candidate_proposals: 1
  abort_on_operational_incomplete: true

operational_incomplete_policy: >-
  Model, transport, timeout, parsing, missing-artifact, repository-authority,
  or exhausted Agent-output-contract failures remain operationally incomplete.
  They are not converted to resolved, unresolved, tied, inverted, or INVALID.
  INVALID is reserved for a structurally valid candidate containing a bullet
  over 64 Checker tokens.

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  controller_slice_time: "00:30:00"
  agent_time: "00:35:00"
  poll_interval_seconds: 30
  max_running_array_tasks: 0
  max_task_attempts: 3
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: verified-paired-repo-concern-playbook-smoke4-v1-20260919

success_criteria:
  - Load exactly two frozen train pairs and two task-disjoint validation pairs.
  - Run two independent label-blind Checker Agents for every evaluated pair.
  - Keep task ID, pair side, historical outcome, Code trajectory, and evaluator result outside each Checker prompt.
  - Score each pair exactly as correct order +1, inverted -1, and either tie 0.
  - Run one repository-aware paired Reflector over both completed sides of each selected training pair.
  - Allow the Reflector and Curator to return no reusable concern.
  - Use a binary concern contract with no Level field while leaving old no-repository and Level-based repo modes unchanged.
  - Preserve Agent completions before Host validation and retry invalid output up to three attempts.
  - Do not import checkpoints or candidates from any previous run.

readiness:
  runnable: true
  launched: false
  missing: []
