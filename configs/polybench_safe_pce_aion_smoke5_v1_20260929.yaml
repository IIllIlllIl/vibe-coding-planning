  image_manifest: output/SWE-PolyBench/polybench-pce-inputs/20260814_python113_v11_8c7d9485d1d0/images.json
  selection_manifest: configs/frozen_polybench_pce_development/20260929_aion_smoke5_v1/selection.json
  prompt_source_config: configs/polybench_pce_hpc_formal_clean_20260825.yaml
