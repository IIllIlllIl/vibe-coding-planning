  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: polybench-safe-pce-smoke5-aion-v1
  worker_config_path: configs/polybench_safe_pce_aion_smoke5_v1_20260929.yaml

evaluator:
  timeout: 1800
  network_disabled: true
