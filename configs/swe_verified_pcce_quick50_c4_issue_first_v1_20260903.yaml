# Paired Planner-v2 diagnostic on every P1 rejected by the completed C4
# SWE-Verified quick50 run. Review-1 is frozen evidence and is not rerun.
mode: swe_verified_pcce
purpose: quick_validation_behavioral_c4_issue_first_revision

paths:
  source_snapshot: output/SWE-bench_Verified/swe-verified-pce-inputs/20260831_verified500_91aa3ed5
