  missing_task_grace_seconds: 600
  max_task_attempts: 3
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: swe-verified-pcce-c4-issue-first-v1-20260903
  worker_config_path: configs/swe_verified_pcce_quick50_c4_issue_first_v1_20260903.yaml
  phase_times:
