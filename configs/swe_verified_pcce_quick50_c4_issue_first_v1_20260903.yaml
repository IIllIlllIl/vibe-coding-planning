pcce:
  guideline_label: behavioral_formal_c4_issue_first_revision_v1
  max_review_rejections: 3
  pce_outcomes_sha256: 1f1e4420ec160d89a144a669d6cfc27ba1b131f35f6b76d59cf496c80650e753
  image_manifest_sha256: fc7db0f468aaf5366981ba46d9db992aec452b991d1e27ff55dd538bf84f0290
  first_review_seed_sha256: aee40f887efbe608d4cf1048777991b63687237fa538c63847a433c0f5c99cb2
