hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: "00:45:00"
  poll_interval_seconds: 300
  task_output_grace_seconds: 300
  missing_task_grace_seconds: 600
  max_task_attempts: 3
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: swe-verified-safe-pce-audit10-v4-20260912
  worker_config_path: configs/swe_verified_safe_pce_audit10_v4_20260912.yaml

evaluator:
  slurm_timeout_outcome: unknown

experiment_contract:
  selected_cases: 10
  selection: frozen_coverage_driven_human_audit_cases
  repositories: 9
  plan_prompt_sha256: 0f14f275e9bca664740a775081655544b0db1f82aca0e42f17dc148188a69c57
  code_prompt_source_sha256: 65dc26a423973913f463242d8bbc7cecf0da2110507cae150f328e84f80d7c36
  source_access_manifest_sha256: 948e15c769a8036621f78c155736a2d1889e223548f0f7b52a178e6e3b5d0f6b
  plan_authority: direct_model_terminal_response_after_FINAL_PLAN
  agent_network_policy: frozen_task_exact_url_allowlist_plus_source_blacklist
  local_git_history_policy: base_commit_and_ancestors_only_after_ref_and_object_prune
  target_repository_install_policy: blocked_by_host_source_boundary
  historical_run_inputs: none
  required_prelaunch_authority: selection_scoped_sif_hash_base_commit_and_source_allowlist
  success_criteria:
    - all ten cases produce direct terminal Plan submissions and atomic Plan checkpoints
    - Plan checkpoint hashes match the exact text handed to Code
    - frozen issue URLs are usable without allowing unlisted HTTP sources or redirects
    - remote Git target-package and URL-or-VCS pip acquisition attempts are blocked
    - local Git exposes the base commit and ancestors but no future refs or unreachable objects
    - local editable installs and non-target dependency installs remain usable
    - all ten cases reach terminal evaluator outcomes without operationally incomplete phases
    - raw trajectories preserve every allowed and blocked attempt for false-positive and false-negative audit
  stopping: finish_all_ten_cases_or_report_operational_incomplete
  operational_incomplete_policy: transport_provider_timeout_or_infrastructure_failure_is_not_unresolved
  launched: false
