  image_manifest_id: 6ff40e56785ca75b40cd99c5f1b60b56832b4c35921f4c20a7290acbab26f097
  required_image_records: 482
  prelaunch_gate:
    independent_selection_frozen: true
    all_selected_sifs_present: true
    all_sif_sha256_values_frozen: true
    all_declared_base_commits_verified: true
    runtime_loader_returns_exact_selection: true
  plan_prompt_text_sha256: dac5af971a23630878f3a223a15a55f308c020762603fd76db2f5599127af4e1
  plan_instance_prompt_text_sha256: d4dac141293d6b6ba9f17e9eb436f36c2f4dc2430039d01b90d40f8de7893d1f
  plan_action_protocol_text_sha256: ce1781dbbf5a8d4633e59f82e5969e1dee176e54f3dd251acfa45ae8e6c64b3e
  code_prompt_text_sha256: cf626bf468fe674e53cc81640083bb674ce6536a7b4b9e575e41ece6ac6ef6f3
