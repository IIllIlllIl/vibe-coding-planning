docker:
  workdir: /testbed
  timeout: 1800
  min_free_gb: 20
  max_cached_images: 75

container:
  runtime: apptainer
  module: tools/Apptainer
  sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  writable_tmpfs: true

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: "01:00:00"
  poll_interval_seconds: 300
  task_output_grace_seconds: 300
  missing_task_grace_seconds: 600
  max_task_attempts: 3
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: swe-verified-safe-pce-formal482-v1-20260914
  worker_config_path: configs/swe_verified_safe_pce_formal482_v1_20260914.yaml

evaluator:
  slurm_timeout_outcome: unknown

experiment_contract:
  status: launch_authorized
  launched: false
  input_universe: frozen_formal482_selection_in_source_order
  split: none_raw_evidence_generation
  selected_cases: 482
  scientific_exclusions: 17
  operational_exclusions: 1
  operational_exclusion_instance_ids:
