  raw_plan_authority: complete_model_terminal_response_with_sha256
  plan_submission_protocol: direct_human_markdown_v5
  plan_format: standalone_task_adaptive_markdown_without_required_nrpv_sections
  plan_audience: human_developer_before_implementation
  plan_search_strategy: four_instruction_anchor_ablation
  local_git_history_policy: multilingual_timesafe_base_and_ancestors
  agent_source_policy: conservative_blacklist_v3
  source_audit_index: all_attempts_case_level_summary_plus_event_logs
  shell_command_parser: bashlex_ast_with_observed_timeout_wrapper
  prompt_url_source: literal_http_urls_in_frozen_issue_description
  non_prompt_http_policy: allow_but_review
  agent_filesystem_policy: complete_testbed_with_host_cwd_disabled_and_package_cache_masked
  evaluator_repository_policy: verify_fresh_immutable_sif_without_reset_or_clean
  evaluator_source_policy: none
  historical_runtime_inputs: none
  budget:
    cases: 482
    planner_and_code_command_timeout_seconds: 1800
    slurm_worker_walltime: "01:00:00"
    agent_attempts: 3
    supervisor_slices: 12
  stopping: finish_all_482_cases_or_report_each_operationally_incomplete_case
  success_criteria:
    - exactly_482_frozen_cases_enter_the_runtime_in_selection_order
    - every_case_reaches_a_terminal_or_explicitly_operationally_incomplete_outcome
    - valid_submissions_begin_with_START_PLAN_and_end_with_END_PLAN
    - only_exact_markdown_between_the_markers_enters_the_plan_checkpoint_and_code_input
    - malformed_boundaries_and_empty_patches_retry_without_host_rewriting
    - official_evaluator_outcomes_are_preserved_without_relabeling_operational_failures
  operational_incomplete_policy: transport_provider_timeout_infrastructure_failure_or_exhausted_evaluator_is_not_unresolved
  postprocessing:
    raw_run_is_not_automatically_training_authority: true
    preserve_raw_artifacts: true
    create_separate_cleaning_ledger_and_derived_dataset: true
    scan_sources:
      - complete_planner_trajectory_for_every_attempt
      - complete_code_trajectory_for_every_attempt
      - source_access_event_logs
    scan_actual_executions_not_only_model_proposals: true
    inspect_every_actually_executed_url: true
    minimum_future_source_indicators:
      - target_repository_pull_request_pages
      - target_repository_commit_pages
      - target_repository_compare_pages
      - patch_or_diff_resources
      - raw_target_repository_files_not_frozen_in_the_task
      - derived_commit_files_or_commits_pages
    leakage_disposition: exclude_from_clean_training_derivative_without_changing_raw_pce_outcome
    operational_disposition: unknown_or_incomplete_is_never_converted_to_unresolved
  known_limitations:
    - lightweight_source_policy_is_not_a_security_sandbox
    - source_access_event_logs_are_supplementary_and_do_not_replace_full_trajectory_audit
    - successful_future_source_access_is_removed_only_in_the_postprocessed_derivative
