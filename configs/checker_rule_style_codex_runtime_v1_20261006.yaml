# Checker-only transport. This is not a GEPA training configuration.
inputs:
  prompt_bundle: configs/prompts/checker_rule_style_codex_v1_20261006.yaml
  repo_checker_contract: configs/prompts/offline_gepa_paired_binary_contract_v2_20260925.yaml
  repo_checker_contract_sha256: 62fcf9e3dbbf8c76b0676f4730ca385167e5488b418a7c58d471397882550299

models:
  checker:
    executor: codex_cli
    model: gpt-6.1-sol
    reasoning_effort: low
    codex_binary: ${HOME}/.local/lib/vibe-codex/0.155.1/bin/codex
    codex_auth_file: ${HOME}/.codex/auth.json
    codex_version: 0.155.1

container:
  runtime: apptainer
  sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache

repo_checker:
  output_contract: binary_v2
  review_only: true
  workdir: /testbed
  command_timeout_seconds: 1800
  source_access_policy: conservative_blacklist_v3
  history_policy: base_ancestor_bundle_v1
  masked_container_paths:
    - /opt/miniconda3/pkgs
  observation_contract: executed_tools_v1
