# Prepared final engineering smoke before any full SWE-Verified Safe PCE run.
mode: swe_verified_pce
purpose: safe_pce_terminal_contract_smoke

paths:
  dataset_snapshot: output/SWE-bench_Verified/swe-verified-pce-inputs/20260831_verified500_91aa3ed5
  image_manifest: configs/frozen_swe_verified_smoke/safe-pce-audit10-v3-20260912-images.json
  selection_manifest: configs/frozen_swe_verified_smoke/swe-verified-safe-pce-audit10-v3-20260912.json
  prompt_source_config: configs/polybench_pce_hpc_formal_clean_20260825.yaml
  plan_prompt_source_config: configs/prompts/swe_verified_safe_pce_planner_v6_anchor_ablation_20260913.yaml
  code_prompt_source_config: configs/prompts/swe_verified_safe_pce_code_v1_20260913.yaml
  run_dir: output/SWE-bench_Verified/swe-verified-pce-runs/development/safe-pce-terminal10-v11-20260913

plan:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 0
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 3
  submission_protocol: direct_final_markdown_v4

code:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 0
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 3

docker:
  workdir: /testbed
  timeout: 1800
  min_free_gb: 20
  max_cached_images: 75

container:
  runtime: apptainer
  module: tools/Apptainer
  sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  writable_tmpfs: true

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: "00:45:00"
  poll_interval_seconds: 300
  task_output_grace_seconds: 300
  missing_task_grace_seconds: 600
  max_task_attempts: 3
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: swe-verified-safe-pce-terminal10-v11-20260913
  worker_config_path: configs/swe_verified_safe_pce_terminal10_v11_20260913.yaml

evaluator:
  slurm_timeout_outcome: unknown

experiment_contract:
  status: prepared_not_launched
  selected_cases: 10
  selection: frozen_coverage_driven_human_audit_cases
  repositories: 9
  method_decision: use_v6_four_instruction_anchor_ablation_prompt
  comparison_runs:
    - safe-pce-audit10-v9-claude-plan-20260913
    - safe-pce-anchor-ablation4-v10-20260913
  changes_since_v10:
    - expand_back_to_frozen_audit10_cases
    - bounded_final_plan_end_plan_authority
    - classify_observed_timeout_source_wrapper
    - summarize_source_access_across_all_attempts
    - dedicated_safe_pce_code_prompt_using_only_the_provided_environment
  plan_prompt_text_sha256: dac5af971a23630878f3a223a15a55f308c020762603fd76db2f5599127af4e1
  code_prompt_text_sha256: cf626bf468fe674e53cc81640083bb674ce6536a7b4b9e575e41ece6ac6ef6f3
  code_instance_prompt_text_sha256: fb9cc998e7c3e7484ce5c19b3c355dc899e9fcd774b3c5080a98c1a16e4a8fc0
  plan_authority: exact_model_text_between_final_plan_and_end_plan
  raw_plan_authority: complete_model_terminal_response_with_sha256
  plan_submission_protocol: direct_final_markdown_v4
  plan_format: standalone_task_adaptive_markdown_without_required_nrpv_sections
  plan_audience: human_developer_before_implementation
  plan_search_strategy: four_instruction_anchor_ablation
  local_git_history_policy: multilingual_timesafe_base_and_ancestors
  repository_baseline_command_timeout: inherit_phase_1800_seconds
  agent_source_policy: conservative_blacklist_v3
  source_audit_index: all_attempts_case_level_summary_plus_event_logs
  source_audit_disposition: no_training_authority_until_case_level_review
  shell_command_parser: bashlex_ast_with_observed_timeout_wrapper
  prompt_url_source: literal_http_urls_in_frozen_issue_description
  non_prompt_http_policy: allow_but_review
  agent_filesystem_policy: complete_testbed_with_host_cwd_disabled_and_package_cache_masked
  evaluator_repository_policy: verify_fresh_immutable_sif_without_reset_or_clean
  evaluator_source_policy: none
  historical_run_inputs: none
  known_limitations:
    - lightweight_source_policy_is_not_a_security_sandbox
    - runtime_generated_source_commands_require_post_filtering
    - four_gibibyte_memory_is_close_to_observed_peak_and_must_be_reassessed
    - some_tasks_may_still_overexplore_without_explicit_stopping_guidance
  budget:
    cases: 10
    planner_and_code_command_timeout_seconds: 1800
    slurm_worker_walltime: "00:45:00"
    agent_attempts: 3
    supervisor_slices: 12
  success_criteria:
    - all ten cases reach terminal or explicitly operationally incomplete outcomes
    - every completed Plan uses bounded v4 authority and preserves the raw terminal response separately
    - provider text after END_PLAN never reaches the Plan checkpoint or Code input
    - the observed timeout-wrapped source acquisition is blocked or review-classified
    - source-access summaries cover all attempts and retain relative log paths and hashes
    - empty patches and malformed Plan boundaries retry without Host rewriting
    - official evaluation starts from verified immutable-SIF repository state
    - completed trajectories receive reliability and task-solvability review before reuse
  stopping: finish_all_ten_cases_or_report_operational_incomplete
  operational_incomplete_policy: transport_provider_timeout_or_infrastructure_failure_is_not_unresolved
  launched: false
