repo_checker:
  output_contract: binary_v1
  review_only: true
  workdir: /testbed
  command_timeout_seconds: 1800
  source_access_policy: conservative_blacklist_v3
  history_policy: base_ancestor_bundle_v1
  masked_container_paths: [/opt/miniconda3/pkgs]

scoring: {correct_order: 1, inverted: -1, tied: 0, invalid: -100}
search:
  max_iterations: 15
  reflection_minibatch_size: 24
  max_metric_calls: 2400
  seed: 42
  perfect_score: 1.0
  skip_perfect_score: false
reflection:
  rounds: 1
  output_contract: ace_v1
curation:
  evidence_contract: ace_v1
refiner:
  enabled: false
length:
  maximum_visible_tokens: 10000
  maximum_bullet_tokens: 64
  harmful_pruning_weight: 2
budget:
  candidate_proposals: 15
  reflection_pairs_per_proposal: 24
  checker_agents_per_pair_evaluation: 2
  reflection_rounds_per_pair: 1
  projected_pair_metric_call_ceiling: 2400
stopping:
  stop_after_candidate_proposals: 15
  abort_on_operational_incomplete: true
operational_incomplete_policy: >-
  Model, subscription, transport, timeout, parsing, missing-artifact,
  evidence-receipt, repository-authority, or exhausted Agent-output-contract
  failures remain operationally incomplete. Host validation retries invalid
  Agent artifacts; it does not rewrite them into scientific outcomes. A
  subscription-usage interruption pauses this run for checkpointed resume; it
  is not a scientific score or a reason to resample completed Agents.

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  controller_slice_time: "00:30:00"
  agent_time: "00:35:00"
  poll_interval_seconds: 60
  max_running_array_tasks: 0
  max_task_attempts: 3
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: verified-paired-ace-codex-formal24-15it-v1-20260925

success_criteria:
  - Use exactly the frozen operationally clean 138 train pairs and original frozen 36 development-validation pairs without resplitting tasks.
  - Start a fresh candidate tree from the atomic one-rule Seed and import no historical Agent outputs, candidates, or checkpoints.
  - Complete fifteen candidate proposals with 24 paired Reflection examples per proposal unless the frozen metric ceiling or an operational interruption stops the run.
  - Keep the paired +1/-1/0 ordering score and binary repository-aware Checker unchanged from the completed smoke.
  - Require each proposed bullet to remain at or below 64 tokens and preserve the 10,000-token whole-playbook boundary.
  - Give every Codex Agent a distinct transient CODEX_HOME with no persisted credentials.
  - Verify Codex CLI 0.155.1 and its read-only sandbox before every inference call.
  - Require every Codex Reflector and Curator output to return the exact SHA-256 receipt for its evidence manifest.
  - Preserve raw Codex events, receipts, Host retries, candidates, counters, pair-order scores, and resumable checkpoints.

readiness: {runnable: true, launched: false, missing: []}
launch_checks:
  - Confirm a clean committed worktree and no duplicate supervisor.
  - Verify the pinned Codex binary, version, isolated state, sandbox preflight, and current ChatGPT subscription login.
  - Verify the frozen dataset, clean138 selection, Seed, prompt, image manifest, SIF cache, and prepared history bundles.
  - Verify Iris storage and file-count headroom before launch.
  - Verify generated Controller and Agent SBATCH requests remain one CPU and 4G.
audit_targets:
  - Track ADD, UPDATE, MERGE, and REMOVE counts per proposal and total playbook growth.
  - Audit exact and semantic overlap, helpful/harmful counters, bullet lengths, plain-English readability, and source-case independence.
  - Compare train and development-validation pair-order scores without treating the exposed validation split as held out.
  - Audit any Checker instability, candidate reversals, operationally incomplete task, or subscription interruption before interpretation.
