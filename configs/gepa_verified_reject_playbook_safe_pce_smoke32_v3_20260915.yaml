  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  controller_slice_time: "00:30:00"
  agent_time: "00:35:00"
  poll_interval_seconds: 30
  max_running_array_tasks: 0
  max_task_attempts: 3
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: verified-reject-playbook-safe-pce-smoke32-v3-20260915

success_criteria:
  - Exactly one proposal uses a 32-case Reflection minibatch with one Reflection round per case.
  - Reflector emits zero or more atomic reusable_concerns objects rather than a compound key_insight string.
  - Checker sees only issue, Plan, and visible bullet text; IDs, counters, repository, outcomes, trajectories, and evaluator evidence remain hidden.
  - Historical raw artifacts are hash-verified and materialized only into repository-free per-case Reflection bundles.
  - Curator reads all 32 final reflections from a read-only file bundle rather than receiving them inline.
  - Host scoring uses the explicit 1/0/-1/1 resolved-proxy table and reserves -100 only for overlength candidate bullets.
  - Every visible bullet is at most 64 Checker tokens; the total visible playbook is at most 2048 tokens.
  - All Agent completions, validation failures, retries, counters, checkpoints, scores, and candidate lineage remain durable.

readiness:
  runnable: true
