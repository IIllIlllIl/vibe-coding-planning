  abort_on_operational_incomplete: true

operational_incomplete_policy: >-
  Model, transport, timeout, parsing, missing-artifact, or exhausted
  Agent-output-contract failures remain operationally incomplete and are not
  converted to unresolved, Bad, or INVALID. INVALID is reserved for a
  structurally valid candidate containing a bullet over 64 Checker tokens.

