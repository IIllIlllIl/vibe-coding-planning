success_criteria:
  - Use exactly twelve train pairs from the historical eighth-iteration scene, all within the new operationally clean 138-pair selection.
  - Keep the four exposed validation pairs task-disjoint from training; they are smoke checks, not held-out evaluation.
  - Run two label-blind repository-aware Checker calls and one structured paired Reflector per selected pair.
  - Retain Plan concerns even when Code Agents compensate differently; do not convert evaluator noise into Plan findings.
  - Require the Curator to disposition every reflected concern and side finding, with supporting pair IDs for used operations.
  - Compare learning trace and candidate rules with the completed eighth iteration; no score improvement is required for operational success.
  - Preserve the frozen 64-token bullet cap, 2048-token visible playbook cap, and operational-incomplete policy.

