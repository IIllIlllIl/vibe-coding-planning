# Copy to a new, identity-specific YAML only after freezing the experiment.
schema_version: 1
session: replace-with-unique-session
log: .local/hpc-supervisor/replace-with-unique-session.log
arguments:
  - --poll-interval
  - "300"
  - --slice-time
  - "00:10:00"
  - --reclaim-staging
  - --require-clean-worktree
  - --batch-script
  - scripts/hpc_submit_WORKFLOW.sh
  - --config
  - configs/WORKFLOW_RUNTIME.yaml
  - --job-name
  - replace-with-unique-job-name
  - --submit
