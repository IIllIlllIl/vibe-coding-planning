  curator: {model: deepseek-v4-flash, temperature: 0.0}
  refiner: {model: deepseek-v4-flash, temperature: 0.0}

repo_checker:
  output_contract: binary_v1
  review_only: true
  workdir: /testbed
  command_timeout_seconds: 1800
  source_access_policy: conservative_blacklist_v3
  history_policy: base_ancestor_bundle_v1
  masked_container_paths: [/opt/miniconda3/pkgs]

scoring: {correct_order: 1, inverted: -1, tied: 0, invalid: -100}
search:
  max_iterations: 1
  reflection_minibatch_size: 12
  max_metric_calls: 100
  seed: 42
  perfect_score: 1.0
  skip_perfect_score: false
reflection:
  rounds: 1
  structured_recovery: true
  structured_abstraction: true
  distilled_curation: true
  fact_links: true
curation:
  evidence_contract: distilled_v1
  require_concern_coverage: false
  self_check_contract: lightweight_v1
length:
  maximum_visible_tokens: 2048
  maximum_bullet_tokens: 64
  harmful_pruning_weight: 2
budget:
  candidate_proposals: 1
  reflection_pairs_per_proposal: 12
  checker_agents_per_pair_evaluation: 2
  reflection_rounds_per_pair: 1
  projected_pair_metric_call_ceiling: 100
stopping:
  stop_after_candidate_proposals: 1
  abort_on_operational_incomplete: true
operational_incomplete_policy: >-
  Model, transport, timeout, parsing, missing-artifact, repository-authority,
  or exhausted Agent-output-contract failures remain operationally incomplete.
  INVALID is reserved for a structurally valid candidate containing a bullet
  over 64 Checker tokens.

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  controller_slice_time: "00:30:00"
  agent_time: "00:10:00"
  poll_interval_seconds: 60
  max_running_array_tasks: 0
  max_task_attempts: 3
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: verified-paired-learning12-smoke-v6-binary-seed-20260924

success_criteria:
  - Run the same frozen Seed, 12 train pairs, and 4 validation pairs as the Level smoke without importing Level outputs.
  - Every reusable concern links to one or more valid side findings.
  - Curator reads the complete linked minibatch index and returns a valid lightweight self-check.
  - Complete fresh binary evaluation of the Seed and any newly proposed candidate without operationally incomplete cases.
  - Preserve artifacts needed to compare binary triggers, Reflection, curation, readability, and candidate selection with the Level run.

readiness: {runnable: true, launched: false, missing: []}
launch_checks:
  - Confirm a clean committed worktree and no duplicate supervisor.
  - Verify Iris storage, API availability, SIF authority, and prepared history bundles.
audit_targets:
  - Compare binary triggers with Level-2 gates on the same pairs and playbook.
  - Compare reusable concerns and Curator operations with the linked Level smoke.
  - Inspect rule readability, correct/inverted/tied ordering, and Checker context sensitivity.
