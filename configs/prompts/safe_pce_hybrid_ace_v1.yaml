reflector_task: |
  Identity fields use local references: case-01 identifies the supplied task,
  and item-01, item-02, etc. identify checklist items. Copy these references
  in instance_id and bullet_tags[].id; Host restores canonical IDs.
  Planner rule_number N refers to the Nth supplied checklist item.
  Explain what this training evidence teaches about flaws in a proposed approach
  that materially threaten correct implementation. The Planner received the task,
  a frozen repository, and a checklist of high-level conditions with item guides.
  A separate Coder received the exact submitted Plan in a fresh workspace,
  followed by the existing benchmark evaluator.

  Use the complete Planner, Coder and evaluator evidence. Distinguish what the
  Plan contributed from Coder corrections, deviations, implementation mistakes
  and operational problems. Compare the Planner's application explanations in
  the original Plan with its actual investigation and subsequent execution.
  Identify reusable blocking concerns and how to investigate and judge them.
  Put reusable improvements in key_insights, grounded in task, Plan, and
  repository evidence available before implementation.

  record.json indexes the supplied training fields by file path. planner_input
  contains the task information available to the Planner. Each pce_runs entry
  retains an independent execution in pce_output: plan is the exact original
  Plan, including the Planner's rule-application explanations; plan_trajectory
  and code_trajectory are complete recorded investigations; patch and
  evaluator_result retain implementation and outcome evidence. score summarizes
  evaluator outcomes across those executions. Examine the original evidence
  when assessing what the Plan and individual rules contributed.

  Return exactly instance_id, reasoning, error_identification, root_cause_analysis,
  correct_approach, key_insights, and bullet_tags. instance_id equals the supplied
  case ID; reasoning is nonempty. error_identification, root_cause_analysis and
  correct_approach are nonempty strings or null when unsupported. key_insights
  is an array of objects with exactly failure_pattern and basis, both nonempty
  strings; use [] when no reusable knowledge is supported. failure_pattern may
  describe a reusable blocking concern or investigation strategy within that
  concern; basis explains its evidence and intended role in the checklist.

  Tag every active item once in supplied order. Each tag has exactly id,
  tag (helpful, harmful, or neutral), and attribution (nonempty string, or null
  only for neutral). Assess the condition together with its item guide.
  Helpful means evidence shows that applying the item contributed to a
  task-correct planning decision about its concern. Harmful means applying it
  contributed to a task-incorrect planning decision. Neutral means the evidence
  establishes neither contribution. Ground each attribution in the local
  planning decision and its consequences. Describe missing coverage in
  key_insights. Distinguish item/guidance defects from Planner or Coder execution
  errors. Follow the shared Agent protocol.

curator_task: |
  Checklist targets use local item-01, item-02, etc. references. Use these exact
  references in target_id or target_ids; Host restores canonical item IDs.
  Maintain a generalized, human-readable checklist of flaws in a proposed
  approach that materially threaten correct implementation or violate critical
  task requirements. Each item has a high-level condition naming a blocking concern
  and its own short guide for investigating and judging that concern.
  Improve the artifact across tasks while preserving useful knowledge.

  ## Planner framework and learning context

  The Planner receives a task, its frozen repository/base commit, and the checklist.
  It uses the conditions and item guides to investigate and address potential
  blocking concerns while developing a standalone Markdown Plan. In the Plan
  it records an application explanation for each
  checklist item: relevant observations and planning consequences, or why the
  concern is not applicable. A fresh Coder receives the exact Plan as its planning
  input. The existing evaluator assesses the implementation. The Planner's
  evidence boundary is the task and frozen repository before implementation.

  Learn from complete P/C/E evidence, including successful execution, Coder
  corrections or deviations, and unsuccessful execution. An evaluator outcome
  is not by itself proof that the Plan or every checklist item caused it.

  ## Evidence and artifact maintenance

  Read manifest.json first. Completely read every required_files entry, including
  every Reflector analysis in reflection_index.json. Read in manageable sections
  and continue if a tool response is truncated. The staged files are:

  - counted_playbook.json: the current checklist, plus counters
    for active items. Each item contains id, condition, and guide. Counters
    summarize Reflector attributions to an item and its guide in their recorded
    context: helpful means applying it contributed to a task-correct planning
    decision about its concern; harmful means a task-incorrect decision;
    neutral means neither contribution is established. Earlier reports retain the
    attribution definitions used when they were produced.
  - reflection_index.json: all current Reflector diagnoses, reusable insights,
    evidence bases and per-item attributions.
  - records.json: local case references and paths to losslessly staged training
    fields. planner_input contains decision-time task information; each pce_runs
    entry preserves its original pce_output, including the exact Plan and its
    rule-application explanations, complete Planner/Coder trajectories, patch,
    and evaluator evidence. score summarizes the recorded evaluator outcomes.
    Consult these fields for supporting or opposing details as needed.
  - rule_feedback_history_index.json (when supplied): current-item counts,
    observation counts, interpretation, counting_policy and lookup paths.
    rule_feedback_history.json preserves full training attributions, reports and
    recorded contexts, including inactive items. Use rule_identity and content
    to distinguish versions; an ID alone does not identify the same knowledge
    across branches. Historical assessments may disagree with newer evidence.
  - limits.json: max_items, condition_tokens,
    and item_guide_tokens. These bound the complete resulting artifact.

  case_reflections.json preserves original full current reports. Required
  reflection_index.json contains their complete diagnoses, insight bases and
  attributions, not just titles. Other optional_files are available for lookup.

  Use supporting and opposing reviews, records, counters and history together
  to maintain existing knowledge as well as learn missing concerns. Collect
  related findings across the batch. One item should express a blocking concern
  reusable across tasks. Distinguish weaknesses in the checklist from
  Planner/Coder execution errors.

  Maintain each condition and guide together through localized operations:
  ADD introduces missing knowledge; UPDATE improves an existing item; MERGE
  combines genuinely related concerns at a higher level; REMOVE discards
  knowledge no longer useful or already covered. Preserve valuable distinctions
  and remove knowledge cautiously using accumulated evidence. Making no change
  is acceptable. Combine items that share a reusable blocking concern while
  preserving distinct concerns as separate items.

  Manage the supplied item budget during curation. Prefer concerns that apply
  across tasks and preserve separate items when applicability differs.

  ## Condition and guide writing

  Write for a developer who understands common software concepts but has not
  seen the training cases. Conditions should be brief checking questions or
  principles, such as whether an approach satisfies explicit requirements or
  preserves important existing behavior. An item guide gives a concrete, reusable
  way to investigate and judge its concern, including detailed judgment when
  useful. Keep each guide within the scope of its condition; a distinct blocking
  concern belongs in its own checklist item.
  Use plain English and familiar software terms. Keep source-case names, symbols
  and incidental mechanisms in supporting evidence. Keep fixed output schemas
  and submission instructions out of learned guides; the framework supplies them.

  ## Budget and output contract

  Respect supplied item and token limits. Each *_tokens limit is a hard ceiling
  in tokenizer tokens, not words, for the complete corresponding text field.
  Host uses LiteLLM's counter with limits.token_counter_model. Limits are ceilings,
  not length targets.

  Return exactly reasoning and operations. reasoning is a nonempty string;
  operations is an array. Empty operations preserves existing checklist items.
  Each operation has exactly these fields:
  ADD: type, content, supporting_instance_ids.
  UPDATE: type, target_id, content, supporting_instance_ids.
  MERGE: type, target_ids, content, supporting_instance_ids.
  REMOVE: type, target_id, supporting_instance_ids.
  content has exactly condition and guide, both nonempty strings. target_id
  names an existing parent item; target_ids names at least two distinct parent
  items. ADD/UPDATE/MERGE require nonempty supporting_instance_ids drawn from
  the current training records. Copy local case-01, case-02, etc. references
  from records.json; Host restores dataset IDs. REMOVE may use [] only when
  justified by supplied accumulated history; explain that basis in reasoning.
  Otherwise supply current supporting case references.
  Target each existing item at most once. Final conditions must be unique and
  at least one item must remain. Host assigns new IDs, maintains counters and
  applies changes mechanically; you supply semantic changes. Follow the shared
  Agent submission protocol.

refiner_task: |
  Checklist IDs use local item-01, item-02, etc. references. Preserve supplied
  references for retained or merged items; Host restores canonical IDs.
  Refine the supplied checklist to meet the hard item-count and token
  limits while preserving useful blocking knowledge and human-readable conditions.
  Combine genuinely related concerns at a higher level, retaining applicability
  distinctions. Keep each item's investigation and judgment within the scope
  of its condition. Consolidate the supplied knowledge while preserving useful
  distinctions between concerns.
  Each *_tokens limit is a hard ceiling in tokenizer tokens, not words, for the
  complete text field. Host uses LiteLLM's counter with limits.token_counter_model.
  Limits are ceilings, not length targets. size_violations, when supplied, lists
  overlength fields with zero-based paths, actual counts, units and limits.
  Retry input includes rejected raw output and validation feedback.
  Return exactly schema_version (1) and checklist.
  Each item has exactly id, condition, guide, all nonempty strings. IDs and
  conditions must be unique. Preserve retained IDs; use existing IDs for merged
  items. At least one item must remain. Follow the shared Agent protocol.
