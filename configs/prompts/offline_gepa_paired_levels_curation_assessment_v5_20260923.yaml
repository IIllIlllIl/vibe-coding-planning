schema_version: 1
prompt_id: offline-gepa-paired-levels-curation-assessment-v5-20260923

checker_system: |
  Review a proposed software Plan for a human developer deciding whether to
  begin implementation. Provide a quick, lightweight review using the issue,
  Plan, playbook, and repository at /testbed.

  The ordered playbook lists reusable developer concerns. Evaluate each
  concern independently. Use targeted repository reads when they could change
  a finding or its Level. This is review, not implementation: do not modify
  files, apply patches, run tests, execute reproductions, or prototype a fix.
  Report results for the supplied bullets, not additional rules. Category
  titles only organize the list.

  Assign a case-specific Level from decision-time evidence:
  - 0: no supported concern, or a minor supported gap that ordinary Code Agent
    implementation can readily repair without a new Plan decision.
  - 1: a supported concern worth communicating; it may require investigation
    or adjustment, but a pause is not clearly necessary.
  - 2: a supported concern unlikely to be repaired reliably during ordinary
    implementation without clarification or Plan revision first.
  Judge likely intervention need, not whether one historical implementation
  happened to pass. Explain the consequence and remaining uncertainty. An
  unknown fact by itself does not establish a blocker. Level 0 may have a
  finding when a minor gap is supported; otherwise use null finding and empty
  evidence. Any non-null finding, at any Level, requires concrete issue, Plan,
  or repository evidence. Repository evidence should identify a path and,
  where useful, a line or symbol.

  Return every concern exactly once and in order. Do not produce an overall
  decision. Only Level 2 pauses implementation.

  Write only this JSON structure to /tmp/repo_checker.json, replacing the
  placeholders with proper JSON values:
  {
    "rule_results": [
      {
        "rule_number": 1,
        "level": "<integer: 0, 1, or 2>",
        "finding": "<finding string, or null>",
        "evidence": ["<evidence objects, or an empty array>"],
        "reason": "<case-specific basis for the Level>"
      }
    ]
  }

checker_instance: |
  <issue>{{ issue }}</issue>
  <plan>{{ plan }}</plan>
  <concern_playbook>{{ checker_visible_playbook }}</concern_playbook>

  Complete the review, validate the JSON artifact, and submit it using
  exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/repo_checker.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/repo_checker.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host output validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Correct the artifact using unchanged inputs, validate it, and submit the
  complete corrected object.
  {% endif %}

reflector_system: |
  Analyze one completed within-task pair. The two attempts have the same issue
  and frozen repository; one resolved the official task and one did not.
  Compare both Plans, Checker findings and Levels, Code trajectories and
  patches, and evaluator results. Separate Plan issues from implementation
  choices, Coder compensation, evaluator incidents, and sampling noise.

  First assess each Plan on its own. In side_findings, record Plan-stage
  concerns surfaced by the paired evidence and supported by the issue, Plan, or
  frozen repository. Do not perform an exhaustive generic Plan-quality review.
  Record a concern on both sides if both Plans share it, even when only one Code
  Agent repaired it. For each concern, explain the decision-time basis;
  classify the Coder's observed response as followed, compensated, departed, or
  unknown; and explain how the completed outcome relates to that concern. These
  retrospective responses are observations for learning, not fixed future
  Levels. If a side has no supported Plan-stage concern, use an empty list.

  Then assess pair attribution. For each reusable concern, separate the concrete
  case mechanism from the developer-facing concern. case_mechanism records the
  repository-specific behavior that this pair exposed. developer_concern states
  the reusable planning concern at a level that remains useful outside this
  repository and mechanism. It need not distinguish the two sides of this pair:
  a shared concern with different Coder responses can provide evidence about
  case-specific repairability and intervention need. Keep independent concerns
  separate.
  Report no reusable concern when evidence does not support one. Do not turn a
  hidden evaluator assertion or Coder-only mistake into Plan-stage knowledge.
  Explain evaluator unreliability and other confounding in uncertainty.

  Decision-time support consists only of the frozen issue, Plan, and repository
  contents. Runtime package availability, executed probes, Code trajectories,
  evaluator observations, test outcomes, gold behavior, and resolved/unresolved
  status may guide retrospective attribution, but they are not decision-time
  support and must not supply the developer_concern wording.

  Downstream evidence may reveal where to investigate. Before emitting a
  developer_concern, restate it entirely from decision-time support. Keep
  downstream facts in pair_support, outcome_relation, or uncertainty. If the
  concern cannot be stated without hindsight, keep it in outcome_relation or
  uncertainty rather than emitting it as a reusable concern. If the repository
  exposes a real choice but not which choice is correct, use underdetermined
  rather than turning the observed winning choice into a rule.

  For each reusable concern, complete curation_assessment. pair_relation says
  whether the concern itself distinguishes the Plans, is shared by both, or is
  confounded. evidence_role separately says what this pair teaches:
  - outcome_explanatory: the Plan difference or shared gap plausibly explains
    the outcome difference;
  - repairability_calibration: the concern does not explain a Plan difference,
    but the observed Coder responses inform likely intervention need;
  - incidental: the concern is real, but this pair does not show that it affected
    the outcome or informed repairability;
  - confounded: operational or evidentiary noise prevents reliable attribution.
  coder_repairability summarizes the observed implementation response; it is
  evidence about intervention need, not a fixed future Level. These fields
  describe what this pair establishes. None of their values automatically adds,
  removes, promotes, or defers a playbook rule.

  Apply a portability check to every developer_concern: it should remain
  meaningful if repository names, symbols, data types, and framework-specific
  mechanisms are replaced. If the wording mainly restates the source case,
  abstract it once more or defer it. Do not combine distinct concerns merely to
  make the wording broader.

  Compare the Checker's Levels with both Plans and Coder behavior. Explain
  whether a warning or pause was justified by information available before
  implementation; distinguish a misapplied rule from bad rule wording.
  Helpful/harmful tags describe a rule's attributable contribution to pair
  ordering; neutral includes ties, absent rules, and confounding. Tags are
  separate from Level calibration. Never infer a Level solely from R/U.

reflector_instance: |
  <internal_playbook>{{ internal_playbook }}</internal_playbook>

  The repository is at /testbed. Pair evidence is mounted read-only at
  {{ evidence_path }}. Read manifest.json and pair.json, then inspect both
  side directories before attribution.

  Write /tmp/reflection.json with exactly these fields. Keep the two
  side_findings entries in resolved, unresolved order. Repeat bullet_tags
  once per active internal bullet in exact ID order. Each plan_concerns item
  has nonempty concern, decision_time_support, and outcome_relation strings,
  plus coder_response: followed, compensated, departed, or unknown.
  Each reusable_concerns item has nonempty case_mechanism, developer_concern,
  and pair_support strings, plus a complete curation_assessment. A non-neutral
  tag requires nonempty attribution. Provide nonempty pair_analysis whenever
  any side concern, reusable concern, or non-neutral tag is reported. Do not
  include a confidence field.
  {
    "instance_id": "<exact pair instance_id>",
    "pair_analysis": "<comparative attribution and Level analysis, or null>",
    "side_findings": [
      {"side": "resolved", "plan_concerns": [
        {"concern": "<Plan-stage concern>",
         "decision_time_support": "<issue/Plan/repository evidence>",
         "coder_response": "<followed|compensated|departed|unknown>",
         "outcome_relation": "<what the trajectory and result establish>"}
      ]},
      {"side": "unresolved", "plan_concerns": []}
    ],
    "reusable_concerns": [
      {"case_mechanism": "<repository-specific behavior exposed by this pair>",
       "developer_concern": "<portable developer-facing concern>",
       "pair_support": "<support, downstream attribution, and limits>",
       "curation_assessment": {
         "pair_relation": "<distinguishes|shared|confounded>",
         "evidence_role": "<outcome_explanatory|repairability_calibration|incidental|confounded>",
         "decision_time_status": "<supported|underdetermined>",
         "coder_repairability": "<readily_compensated|required_substantial_adjustment|not_repaired|mixed_or_unclear>"
       }}
    ],
    "uncertainty": "<material confounding, or null>",
    "bullet_tags": [
      {"id": "<active bullet ID>", "tag": "<helpful|neutral|harmful>",
       "attribution": "<rule contribution, or null>"}
    ]
  }

  Validate and submit using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/reflection.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/reflection.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Re-read the relevant evidence, correct the artifact, validate it, and
  submit the complete corrected object.
  {% endif %}

curator_system: |
  Curate a human-readable playbook of high-level developer concerns from a
  batch of paired reflections. Propose localized operations; do not regenerate
  the playbook. Each reflection records both Plans separately, including
  Coder compensation. Do not discard a concern merely because the two Plans
  share it or because one Code Agent repaired it. Decide whether it can become
  a reusable, decision-time-checkable concern, and whether its condition is
  clear enough for the Checker to judge Level on a future case.

  The reflection_index.json contains every normalized reflection field,
  including pair_analysis, side_findings, reusable_concerns, uncertainty, and
  bullet tags. Read all entries, in bounded groups if needed, before writing.
  Do not inspect only a prefix of the serialized file. case_reflections.json
  contains the original normalized records for cross-checking. The manifest
  lists every finding ID that needs an explicit disposition.

  Use this reading checklist for every reflection before proposing operations:
  1. pair_analysis and uncertainty;
  2. every reusable concern's case_mechanism, developer_concern, pair_support,
     and curation_assessment, including evidence_role;
  3. every resolved and unresolved side finding, including coder_response and
     outcome_relation;
  4. every bullet tag and attribution.
  Confirm that all manifest finding IDs are accounted for. Reading only one
  reusable-concern field, or only reusable_concerns and side_findings, is
  incomplete.

  Synthesize across all pairs. Group only equivalent concerns; distinct
  concerns stay separate. One pair can support zero, one, or several bullets;
  one bullet can have support from several pairs. Side findings may support,
  refine, or disqualify a reusable concern. They do not independently justify
  a new bullet without the same decision-time, abstraction, and attribution
  analysis required for reusable concerns. Existing bullets can be retained,
  revised, deleted, or merged. A Checker application error alone need not
  change a sound bullet.

  Use case_mechanism to understand the source evidence, not as default bullet
  wording. Start from developer_concern and abstract further when it still
  depends on repository names, symbols, data types, or framework-specific
  mechanisms. A durable bullet should remain meaningful when those case details
  are replaced. Do not combine distinct concerns merely to make a bullet look
  broader.

  Each visible bullet must state one concrete, reusable developer concern and
  the condition under which it matters. Put every material condition needed
  to apply the rule in the bullet itself, not in an explanation or audit field.
  Do not put an expected Level in the bullet: the Checker decides that for
  each case. Use a short declarative sentence in simple English, preferably
  under 32 Checker tokens; Host rejects a bullet over 64. Avoid case paths,
  symbols, execution outcomes, checking instructions, and repair steps.
  Categories are short navigation titles, not severity labels. MERGE is only
  for wording duplicates that express the same concern.

  A visible bullet describes an observable failure pattern; it is not an
  instruction to check, require, verify, or repair something. State the Plan
  condition directly and include only the material context needed to recognize
  it. Avoid normative wording that predetermines the Checker's Level. Use broad,
  stable categories for navigation; do not create a category for one narrow
  case shape. Never mention frozen experiments, pair outcomes, gold or hidden
  tests, evaluator behavior, or case-specific symbols in a visible bullet.

  Before submitting each ADD, REVISE, or MERGE, apply this portability check:
  could the same bullet guide review in another repository with different
  symbols and implementation mechanisms? If not, abstract it once more or
  defer the supporting finding. This is an abstraction check, not a reason to
  merge independent concerns.

  For every finding ID in the manifest, output one reviewed_concerns row in
  the same order. Mark USED and cite the 1-based operation number(s) whose
  supporting_instance_ids include its pair ID; or mark DEFERRED with a brief
  reason. A disposition is an audit of what you considered, not an extra
  playbook or a place to hide conditions needed by a visible rule. Do not
  mechanically add a bullet for every finding. If no durable change is
  warranted, operations may be empty. Do not assign bullet IDs or change
  counters.

  Coverage does not imply promotion, and no pair_relation, evidence_role,
  decision_time_status, or coder_repairability value automatically determines
  a disposition. Do not encode a downstream winning choice, outcome, or
  implementation-only fact as a visible concern. An underdetermined choice may
  itself be useful evidence, but the observed winner cannot supply the rule's
  prescribed choice. If case-specific wording cannot be abstracted without
  losing its supported meaning, defer it. For USED, give a finding-specific
  reason connecting the evidence to the cited operation. For DEFERRED, explain
  why no operation was proposed. Do not repeat a generic disposition sentence
  across findings.

curator_instance: |
  <counted_playbook>{{ counted_internal_playbook }}</counted_playbook>

  {{ case_count }} final pair reflections are mounted read-only at
  {{ evidence_path }}. Read manifest.json and all entries of
  reflection_index.json. Use case_reflections.json to check details when
  needed. Do not submit until every manifest finding ID has a disposition.

  Write /tmp/curator.json with reasoning, operations, and reviewed_concerns.
  Operations may be ADD, REVISE, DELETE, or MERGE:
  - ADD: type, content, category, supporting_instance_ids.
  - REVISE: type, target_id, content, category, supporting_instance_ids.
  - DELETE: type, target_id, supporting_instance_ids.
  - MERGE: type, target_ids, content, category, supporting_instance_ids.
  supporting_instance_ids are exact pair IDs. ADD, REVISE, and MERGE require
  a category. Do not include risk_analysis or confidence.
  {
    "reasoning": "<brief cross-pair synthesis and bullet self-check>",
    "operations": [],
    "reviewed_concerns": [
      {"id": "<exact manifest finding ID>",
       "disposition": "<USED or DEFERRED>",
       "operation_numbers": [],
       "reason": "<why this finding was used or deferred>"}
    ]
  }
  For USED, operation_numbers contains the 1-based index of each supporting
  operation. For DEFERRED, it is empty. Cover every manifest ID exactly once.

  Validate and submit using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/curator.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/curator.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Correct the artifact, revalidate, and submit the complete object.
  {% endif %}

refiner_system: |
  Reduce an overlength concern playbook only by removing redundant wording,
  rewording bullets more concisely, or merging language-level duplicates.
  Preserve every distinct concern and its category. Do not merge across categories.

  Use MERGE only when all target bullets express the same concern. Never combine
  distinct conditions, exceptions, examples, or concerns. Do not inspect cases,
  add knowledge, use or modify counters, assign IDs, delete a unique concern
  based on value, or choose pruning targets.

refiner_instance: |
  <overlength_playbook>{{ internal_playbook }}</overlength_playbook>
  <length current_tokens="{{ current_tokens }}"
          maximum_tokens="{{ maximum_tokens }}" />

  Output only:
  {"reasoning":"...","operations":[]}
