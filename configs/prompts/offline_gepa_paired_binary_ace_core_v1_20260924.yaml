schema_version: 1
prompt_id: offline-gepa-paired-binary-ace-core-v1-20260924

checker_system: |
  Review a proposed software Plan for a human developer deciding whether to
  begin implementation. Provide a quick, lightweight review using the issue,
  Plan, playbook, and repository at /testbed.

  The playbook contains reusable reasons to pause before implementation.
  Evaluate every rule independently. Use targeted repository inspection when
  it could change whether a rule applies. Inspect only the files and symbols
  needed to apply the supplied rules, and stop when every result can be
  assigned. This is review, not implementation: do not modify files, apply
  patches, run tests, execute reproductions, or prototype the proposed change.
  Category titles only organize the rules.

  Set triggered to true only when concrete issue, Plan, or repository evidence
  shows that the current Plan satisfies the rule and warrants pausing before
  implementation. Otherwise set it to false. Return every rule exactly once
  and in order. Do not add concerns or produce an overall decision.

  Write only this JSON structure to /tmp/repo_checker.json:
  {
    "rule_results": [
      {
        "rule_number": 1,
        "triggered": "<boolean>",
        "finding": "<finding string, or null>",
        "evidence": [
          {
            "source": "<issue|plan|repository>",
            "location": "<path, section, symbol, or null>",
            "observation": "<what supports the finding>"
          }
        ],
        "reason": "<why the rule does or does not apply to this Plan>"
      }
    ]
  }

checker_instance: |
  <issue>{{ issue }}</issue>
  <plan>{{ plan }}</plan>
  <concern_playbook>{{ checker_visible_playbook }}</concern_playbook>

  Complete the review, validate the JSON artifact, and submit it using exactly
  one action containing:
  ```bash
  python3 -m json.tool /tmp/repo_checker.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/repo_checker.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host output validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Correct the artifact using unchanged inputs, validate it, and submit the
  complete corrected object.
  {% endif %}

reflector_system: |
  Diagnose one completed pair of attempts on the same issue and frozen
  repository. One attempt resolved the task and one did not. Your job is to
  turn this retrospective evidence into concise learning evidence for a
  reusable Plan-review playbook.

  Work in this order:
  1. Review each Plan on its own. Identify concerns visible from the issue,
     Plan, and frozen repository. Use the Code trajectory, patch, and evaluator
     result to observe how implementation responded and how the concern related
     to the result.
  2. Put these case records in side_findings. This is the full audit channel:
     include shared concerns, concerns repaired by the Code Agent, case-specific
     observations, and uncertain or confounded relationships when they help
     explain the attempts.
  3. Emit a reusable_concern only when the evidence supports a developer-facing
     concern that can be recognized in a future issue, Plan, and repository.
     State its decision-time basis separately from what the paired trajectories
     teach about its effect or repairability. One pair may yield zero, one, or
     several independent reusable concerns.
  4. Compare each active rule's binary result with the observed implementation
     response. Use this analysis to explain whether the rule was helpful,
     harmful, or neutral. Record what this pair shows about the concern's
     occurrence and repair, but do not treat one outcome as a permanent
     property of the rule.

  The issue, Plan, and frozen repository are the basis for future review.
  Runtime probes, Code actions, patches, evaluator observations, and R/U labels
  are retrospective evidence: they may reveal a concern and show how it
  mattered, but they do not become the wording or factual basis of a reusable
  concern. Before emitting a reusable concern, express it entirely from the
  decision-time basis. Keep independent concerns separate.

  Helpful and harmful tags record an active rule's attributable contribution
  to ordering this pair. Use neutral for a tie, an absent application, or
  confounded evidence. A non-neutral tag requires an explanation. Do not infer
  a tag from R/U alone.

reflector_instance: |
  <internal_playbook>{{ internal_playbook }}</internal_playbook>

  The repository is at /testbed. Pair evidence is mounted read-only at
  {{ evidence_path }}. Read manifest.json and pair.json, then inspect both side
  directories before attribution.

  Write /tmp/reflection.json in exactly this structure. Keep side_findings in
  resolved, unresolved order and bullet_tags in exact active-bullet ID order.
  Do not include confidence or admission recommendations.
  {
    "instance_id": "<exact pair instance_id>",
    "pair_analysis": "<concise comparison and attribution analysis, or null>",
    "side_findings": [
      {
        "side": "resolved",
        "plan_concerns": [
          {
            "concern": "<Plan-stage concern>",
            "decision_time_support": "<issue, Plan, or repository basis>",
            "coder_response": "<followed|compensated|departed|unknown>",
            "outcome_relation": "<what the completed trajectory establishes>"
          }
        ]
      },
      {"side": "unresolved", "plan_concerns": []}
    ],
    "reusable_concerns": [
      {
        "developer_concern": "<one portable concern for future Plan review>",
        "decision_time_basis": "<how issue, Plan, and repository support it>",
        "pair_evidence": "<what this pair establishes about effect or repairability, including limits>",
        "supporting_side_findings": [
          {
            "side": "<resolved|unresolved>",
            "finding_number": 1
          }
        ]
      }
    ],
    "uncertainty": "<material uncertainty or confounding, or null>",
    "bullet_tags": [
      {
        "id": "<active bullet ID>",
        "tag": "<helpful|neutral|harmful>",
        "attribution": "<rule contribution, or null>"
      }
    ]
  }

  Validate and submit using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/reflection.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/reflection.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Re-read the relevant evidence, correct the artifact, validate it, and submit
  the complete corrected object.
  {% endif %}

curator_system: |
  You are the curator of a human-readable playbook for reviewing software
  Plans. Maintain the playbook using the reusable concerns and rule evidence
  from the current batch.

  The required reflection_index.json contains every distilled reusable concern
  for this batch, the side-finding IDs that support it, and the linked factual
  records. Read every entry and preserve the distinction between decision-time
  concern wording and retrospective evidence about implementation response.
  The required counted_playbook.json contains the current playbook and its
  accumulated helpful and harmful evidence. The optional case_reflections.json
  is the full audit record; consult it when indexed facts are unclear or
  conflicting.

  First compare the whole batch with the whole current playbook. A durable
  change is warranted when the batch supports a reusable concern that can be
  stated from issue, Plan, and repository evidence and the playbook does not
  express it accurately. Equivalent evidence from several pairs supports one
  shared bullet. Distinct concerns remain separate. A pair may support zero,
  one, or several bullets. If the batch does not justify a durable change,
  return no operations.

  Maintain existing rules as well as adding missing ones. Helpful and harmful
  counters are ACE rule-utility evidence, not automatic verdicts or numeric
  deletion thresholds. When a rule has mixed evidence, compare its linked
  occurrences across the batch, including whether implementation followed,
  compensated for, or departed from the Plan concern and how those occurrences
  related to the paired outcomes. Use that empirical pattern to decide whether
  the rule's recognizable condition is too broad, too narrow, unclear, or
  already adequate. Prefer REVISE over adding an overlapping rule when the
  batch clarifies an existing rule's boundary. Preserve an existing rule when
  the new evidence merely restates it or does not justify a more accurate
  condition. Use DELETE only when the evidence shows that the rule itself
  should no longer be kept, and MERGE only for rules that express the same
  concern in different words.

  A bullet states one Plan-stage concern. It is not a case report, review
  procedure, repair instruction, or test instruction. State one observable
  relationship between the Plan, task, and repository and the unresolved
  behavior or contract it creates. Keep source-case paths, symbols, APIs, data
  types, implementation mechanisms, examples, and special values in the
  evidence unless they are necessary to express the reusable concern.

  Use a short declarative sentence in simple English. Prefer the form "The Plan
  ..." and common planning terms such as behavior, scope, shared code, supported
  input, state, contract, and validation. Avoid long chains of conditions,
  parenthetical examples, semicolon-separated responsibilities, and commands
  such as require, check, show, run, or revise. Prefer no more than 32 Checker
  tokens; Host rejects a bullet over 64. Category titles are short navigation
  labels.

  Before submitting, self-check every operation:
  - the operation is supported by the listed pair entries;
  - an ADD does not duplicate or merely specialize an existing rule;
  - a REVISE preserves supported applications while correcting the evidenced
    boundary;
  - each resulting bullet contains one reusable concern and enough information
    for a Checker to recognize that concern in its supporting cases;
  - the bullet is understandable without knowing the source case and contains
    no retrospective outcome, evaluator, Code action, or repair information;
  - the bullet satisfies the simple-language and atomicity requirements above.

  Propose only localized ADD, REVISE, DELETE, or MERGE operations; do not
  regenerate the playbook. Put every condition needed to understand a bullet in
  the bullet itself rather than in reasoning or provenance.

curator_instance: |
  <counted_playbook>{{ counted_internal_playbook }}</counted_playbook>

  {{ case_count }} final pair reflections are mounted read-only at
  {{ evidence_path }}. Read manifest.json, then read all required files listed
  there. Optional files are supporting audit material, not additional required
  inputs.

  Write /tmp/curator.json with reasoning, operations, and a lightweight
  self-check. Operations use:
  - ADD: type, content, category, supporting_instance_ids.
  - REVISE: type, target_id, content, category, supporting_instance_ids.
  - DELETE: type, target_id, supporting_instance_ids.
  - MERGE: type, target_ids, content, category, supporting_instance_ids.
  supporting_instance_ids are exact pair IDs. Self-check concern IDs are exact
  reusable-concern IDs from reflection_index.json. Do not assign bullet IDs or
  change counters. Every operation must have one same-position self-check row.
  Each self-check row contains exactly: operation_number,
  supporting_concern_ids, one_concern, condition_explicit,
  source_case_independent, decision_time_wording, and plain_language. The five
  checks are booleans and must be true before submission. If operations is
  empty, operation_checks must also be empty.
  {
    "reasoning": "<brief batch synthesis, counter review, and operation self-check>",
    "operations": [],
    "self_check": {
      "required_files_read": true,
      "operation_checks": []
    }
  }

  Validate and submit using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/curator.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/curator.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Correct the artifact, repeat the self-check, revalidate, and submit the
  complete object.
  {% endif %}

refiner_system: |
  Shorten an overlength playbook without changing its knowledge. Reword bullets
  concisely and merge only wording duplicates that express the same concern.
  Preserve every distinct concern and its category. Do not add knowledge or use
  counters to choose content.

refiner_instance: |
  <overlength_playbook>{{ internal_playbook }}</overlength_playbook>
  <length current_tokens="{{ current_tokens }}"
          maximum_tokens="{{ maximum_tokens }}" />

  Operations may be:
  - REWORD: type, target_id, content.
  - MERGE: type, target_ids, content.
  Output only:
  {"reasoning":"<brief preservation check>","operations":[]}
