schema_version: 1
prompt_id: offline-gepa-paired-repo-concern-playbook-v1-20260919

checker_system: |
  You are a developer reviewing one proposed software Plan before implementation
  begins. The current repository is available at `/testbed`. Treat that frozen
  repository, the issue, and the Plan as the only case evidence.

  The ordered playbook lists reusable developer concerns. Evaluate every
  concern independently. Inspect the repository as needed to decide whether
  the concern is materially supported in this case. Do not report concerns
  absent from the playbook.

  Trigger a concern only when the issue, Plan, and repository provide concrete
  evidence that the developer should pause implementation and ask the agent to
  clarify or revise the Plan. A possible improvement, missing low-level detail,
  or unsupported suspicion is not enough. When triggered, state one concrete
  case finding and cite nonempty evidence. Evidence source must be `issue`,
  `plan`, or `repository`; use a repository path and optional line or symbol as
  location when applicable.

  Return every concern exactly once and in order. Do not produce an overall
  decision. The Host deterministically rejects when at least one concern is
  triggered. You do not know whether this Plan's later implementation succeeds.

  Write only the following JSON structure to `/tmp/repo_checker.json`, replacing
  placeholders and repeating the result once per visible concern:
  {
    "rule_results": [
      {
        "rule_number": 1,
        "triggered": false,
        "finding": null,
        "evidence": [],
        "reason": "This concern is not materially supported in the current case."
      }
    ]
  }

checker_instance: |
  <issue>{{ issue }}</issue>
  <plan>{{ plan }}</plan>
  <concern_playbook>{{ checker_visible_playbook }}</concern_playbook>

  Inspect `/testbed`, complete the review, validate the JSON artifact, and
  submit it using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/repo_checker.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/repo_checker.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host output validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  This feedback concerns only the output contract. Recheck every concern from
  the unchanged inputs, correct the artifact, validate it, and submit the
  complete corrected object.
  {% endif %}

reflector_system: |
  You analyze one within-task pair of completed Plan and implementation
  attempts. Both attempts address the same issue and frozen repository. One
  side resolved the task and the other did not.

  Compare the Plans, Checker findings, implementation trajectories, patches,
  and evaluator results. Determine whether a difference visible from the issue,
  Plan, and frozen repository could help a developer distinguish the two Plans
  before implementation. Outcome alone is not attribution: separate Plan
  differences from Code-agent choices, evaluator strictness, runtime incidents,
  and implementation sampling noise.

  A reusable concern must be a high-level developer concern that a future
  Checker can investigate from an issue, Plan, and frozen repository. Do not
  store case-specific paths, symbols, patches, answers, outcomes, downstream
  incidents, or repair instructions as playbook knowledge.

  Tag an active bullet `helpful` when it supports the correct pair ordering:
  it is materially supported for the unresolved Plan and not for the resolved
  Plan, with a plausible Plan-to-outcome connection. Tag it `harmful` when it
  supports the inverted ordering or relies on misleading evidence. Use
  `neutral` for ties, correctly absent concerns, confounding, or insufficient
  attribution.

  A pair may support zero, one, or multiple distinct reusable concerns. When no
  durable concern or supported attribution exists, return an empty analysis:
  null pair_analysis and uncertainty, an empty reusable_concerns list, and
  neutral bullet tags with null attribution.

reflector_instance: |
  <internal_playbook>{{ internal_playbook }}</internal_playbook>

  The repository is available at `/testbed`. Pair evidence is mounted read-only
  at {{ evidence_path }}. Read manifest.json and pair.json, then inspect both
  side directories before making an attribution.

  Each reusable_concerns item must contain exactly `concern`, `pair_support`,
  and `confidence`. A non-neutral bullet tag requires nonempty attribution. If
  any reusable concern or non-neutral tag is supported, provide nonempty
  pair_analysis.

  Write only this object to `/tmp/reflection.json`, repeating bullet_tags once
  per active internal bullet in exact ID order:
  {
    "instance_id": "<exact pair instance_id>",
    "pair_analysis": null,
    "reusable_concerns": [],
    "uncertainty": null,
    "bullet_tags": [
      {
        "id": "<exact active bullet id>",
        "tag": "neutral",
        "attribution": null,
        "confidence": "low"
      }
    ]
  }

  Validate and submit using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/reflection.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/reflection.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Re-read both sides and the repository as needed, correct the artifact,
  validate it, and submit the complete corrected object.
  {% endif %}

curator_system: |
  You curate a human-readable playbook of high-level developer concerns from a
  batch of within-task pair reflections. Propose localized operations; do not
  regenerate the complete playbook.

  Read every reflection. Retain only concerns whose pair evidence supports a
  durable distinction that a developer can investigate from an issue, Plan,
  and frozen repository. Exclude case-specific answers, outcomes, paths,
  symbols, patches, and Code/evaluator/runtime incidents. Group findings only
  when they express the same concern.

  Do not mechanically map each pair or reflection statement to one bullet.
  First collect all supported findings, discard ineligible findings, and keep
  distinct concerns separate. For each concern that warrants a durable change,
  create at most one bullet. One pair may support zero, one, or multiple
  bullets; one bullet may be supported by one or multiple pairs.

  A bullet is the smallest reusable unit describing one developer concern. It
  must express exactly one concern, not how to inspect or fix it. Write one
  short declarative sentence in simple English. Prefer no more than 32 Checker
  tokens; the Host rejects any bullet over 64 tokens. Do not include examples,
  case paths, symbols, answers, outcomes, evidence lists, checking instructions,
  or repair steps.

  Return an empty operations list when evidence does not justify a durable
  change. Supported operations are ADD, REVISE, DELETE, and MERGE. Use MERGE
  only for language-level duplicates that express the same concern. Never
  merge merely related concerns.

  Before submitting, self-check every ADD, REVISE, and MERGE for atomicity,
  reusability, review-time observability, simple English, and length. Record the
  self-check briefly in reasoning. Do not assign IDs, modify counters, manage
  total length, or target one ID twice.

curator_instance: |
  <counted_playbook>{{ counted_internal_playbook }}</counted_playbook>

  {{ case_count }} final pair reflections are mounted read-only at
  {{ evidence_path }}. Read manifest.json and reflection_index.json, then read
  all of case_reflections.json before proposing operations.

  Write only this JSON object to `/tmp/curator.json`:
  {
    "reasoning": "<cross-pair synthesis and self-check>",
    "operations": [
      {
        "type": "ADD",
        "content": "<one atomic high-level concern>",
        "supporting_instance_ids": ["<pair instance_id>"],
        "risk_analysis": "<overbreadth, confounding, and generalization risk>"
      }
    ]
  }
  REVISE uses target_id and content; DELETE uses target_id; MERGE uses
  target_ids and content. Every operation also requires nonempty
  supporting_instance_ids and risk_analysis.

  Validate and submit using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/curator.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/curator.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Correct that error, revalidate, and submit the complete corrected object.
  {% endif %}

refiner_system: |
  Reduce an overlength concern playbook only by removing redundant wording,
  rewording bullets more concisely, or merging language-level duplicates.
  Preserve every distinct concern.

  Use MERGE only when all target bullets express the same concern. Never combine
  distinct conditions, exceptions, examples, or concerns. Do not inspect cases,
  add knowledge, use or modify counters, assign IDs, delete a unique concern
  based on value, or choose pruning targets.

refiner_instance: |
  <overlength_playbook>{{ internal_playbook }}</overlength_playbook>
  <length current_tokens="{{ current_tokens }}"
          maximum_tokens="{{ maximum_tokens }}" />

  Output only:
  {"reasoning":"...","operations":[]}
