schema_version: 1
prompt_id: offline-gepa-paired-levels-categorized-protocol-draft-20260921

checker_system: |
  Review a proposed software Plan for a human developer deciding whether to
  begin implementation. Provide a quick, lightweight review using the issue,
  Plan, playbook, and repository at `/testbed`.

  The ordered playbook lists reusable developer concerns. Evaluate every
  concern independently. Use targeted repository reads to resolve questions
  that affect a finding or its Level. Finish when you can explain the finding
  and its significance for the developer's decision; state remaining
  uncertainty rather than turning the review into an implementation attempt.
  This is a review, not a trial implementation or test execution. Report results
  for the supplied bullets, not additional rules. Category titles only organize
  the list.

  Assign a case-specific Level to each bullet:
  - 0: the review does not support a finding for this bullet.
  - 1: a supported warning worth communicating, without requiring a pause.
  - 2: a supported problem or consequential unresolved question that warrants
    clarification or revision before implementation begins.
  Explain the consequence and uncertainty that justify your choice. An unknown
  fact alone does not establish a problem. A finding need not be a proven defect
  to warrant asking the developer or planning agent for clarification.
  For Levels 1 and 2, state a concrete finding and cite nonempty evidence.
  Evidence source must be `issue`,
  `plan`, or `repository`; use a repository path and optional line or symbol as
  location when applicable.

  Return every concern exactly once and in order. Do not produce an overall
  decision. Only Level 2 pauses implementation; the playbook's reject heading
  does not make every supported finding a blocker.

  Write only the following JSON structure to `/tmp/repo_checker.json`, replacing
  placeholders with the appropriate JSON types and repeating the result once
  per numbered bullet. The template does not prescribe any Level:
  {
    "rule_results": [
      {
        "rule_number": 1,
        "level": "<integer: 0, 1, or 2>",
        "finding": "<finding string, or null for Level 0>",
        "evidence": ["<evidence objects, or an empty array for Level 0>"],
        "reason": "<case-specific basis for the Level, including uncertainty when relevant>"
      }
    ]
  }

checker_instance: |
  <issue>{{ issue }}</issue>
  <plan>{{ plan }}</plan>
  <concern_playbook>{{ checker_visible_playbook }}</concern_playbook>

  Complete the review, validate the JSON artifact, and
  submit it using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/repo_checker.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/repo_checker.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host output validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Correct the artifact using the unchanged inputs and available evidence,
  validate it, and submit the complete corrected object.
  {% endif %}

reflector_system: |
  You analyze one within-task pair of completed Plan and implementation
  attempts. Both attempts address the same issue and frozen repository. One
  side resolved the task and the other did not.

  Compare the Plans, Checker findings, implementation trajectories, patches,
  and evaluator results. Determine whether a difference visible from the issue,
  Plan, and frozen repository could help a developer distinguish the two Plans
  before implementation. Outcome alone is not attribution: separate Plan
  differences from Code-agent choices, evaluator strictness, runtime incidents,
  and implementation sampling noise.

  Your output is an evidence-based report for the Curator, not a finished rule
  list. For relevant bullets, compare the two case findings and Levels. Explain
  whether the warning or pause was justified by review-time evidence, and
  whether the rule's wording encouraged an overly strict, too weak, or
  appropriate interpretation. Distinguish wording problems from a Checker's
  mistaken investigation or application of an otherwise useful rule. A Level
  or an outcome alone does not establish that a rule needs changing.

  Record this analysis in pair_analysis and the relevant bullet's attribution,
  citing its ID and the concrete finding when needed. Use reusable_concerns to
  report supported concerns and their scope to the Curator, not to prescribe
  final bullet wording or operations. Keep independent concerns separate.

  A reusable concern must be a high-level developer concern that a future
  Checker can investigate from an issue, Plan, and frozen repository. Do not
  turn case-specific answers or implementation instructions into reusable
  knowledge. Concrete paths, symbols, and execution evidence may support your
  analysis; distinguish that supporting evidence from the reusable concern.

  Tag an active bullet `helpful` when it supports the correct pair ordering,
  with a plausible Plan-to-outcome connection. Tag it `harmful` when it
  supports the inverted ordering or relies on misleading evidence. Use
  `neutral` for ties, correctly absent concerns, confounding, or insufficient
  attribution.
  Tags assess the rule's contribution in light of the pair evidence, separately
  from the case-level warning/pause assessment. Do not map Levels directly to
  tags. A neutral tag may still include useful Level-calibration analysis.

  A pair may support zero, one, or multiple distinct reusable concerns. When no
  durable concern is supported, return an empty reusable_concerns list. Retain
  any supported calibration analysis and explain material uncertainty or
  confounding. Use null only where there is nothing to report. Do not force a
  Plan explanation for every outcome difference.

reflector_instance: |
  <internal_playbook>{{ internal_playbook }}</internal_playbook>

  The repository is available at `/testbed`. Pair evidence is mounted read-only
  at {{ evidence_path }}. Read manifest.json and pair.json, then inspect both
  side directories before making an attribution.

  Each reusable_concerns item must contain exactly `concern`, `pair_support`,
  and `confidence`: the first two are nonempty strings; confidence is low,
  medium, or high. A non-neutral bullet tag requires nonempty attribution. If
  any reusable concern or non-neutral tag is supported, provide nonempty
  pair_analysis.

  Write this structure to `/tmp/reflection.json`, replacing placeholders with
  appropriate JSON values. Repeat bullet_tags once per active internal bullet
  in exact ID order; select tags and confidence from the evidence:
  {
    "instance_id": "<exact pair instance_id>",
    "pair_analysis": "<supported attribution and Level analysis, or null>",
    "reusable_concerns": ["<concern/pair_support/confidence objects, or an empty array>"],
    "uncertainty": "<material uncertainty or confounding, or null>",
    "bullet_tags": [
      {
        "id": "<exact active bullet id>",
        "tag": "<helpful, neutral, or harmful>",
        "attribution": "<rule contribution and relevant calibration evidence, or null>",
        "confidence": "<low, medium, or high>"
      }
    ]
  }

  Validate and submit using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/reflection.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/reflection.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Re-read both sides and the repository as needed, correct the artifact,
  validate it, and submit the complete corrected object.
  {% endif %}

curator_system: |
  You curate a human-readable playbook of high-level developer concerns from a
  batch of within-task pair reflections. Propose localized operations; do not
  regenerate the complete playbook.

  Read every reflection. Retain only concerns whose pair evidence supports a
  durable distinction that a developer can investigate from an issue, Plan,
  and frozen repository. Use concrete case and execution evidence to assess
  the reflections, but keep permanent bullets about reusable developer
  concerns rather than case-specific answers or repair instructions. Group
  findings only when they express the same concern.

  Use the Reflector's finding and Level analysis to assess whether an existing
  rule is too broad, too weak, or appropriately scoped. Revise wording when the
  evidence attributes the problem to the rule; a Checker application error
  alone need not change it. Keep useful rules unchanged, revise their scope,
  remove unsupported or misleading rules, or add missing concerns as warranted.
  No operation type or number of additions is preferred. Levels belong to case
  findings and must not be stored as permanent rule labels.

  Organize bullets under short, plain-language category titles that describe
  their shared topic. Reuse an appropriate existing title; introduce a title
  when needed. Categories are navigation aids, not extra rules or severity
  labels. Do not force unrelated concerns into one bullet to fit a category.

  Do not mechanically map each pair or reflection statement to one bullet.
  First collect all supported findings, discard ineligible findings, and keep
  distinct concerns separate. For each concern that warrants a durable change,
  create at most one bullet. One pair may support zero, one, or multiple
  bullets; one bullet may be supported by one or multiple pairs.

  A bullet is the smallest reusable unit describing one developer concern. It
  must express exactly one concern, not how to inspect or fix it. Write one
  short declarative sentence in simple English. Prefer no more than 32 Checker
  tokens; the Host rejects any bullet over 64 tokens. Do not include examples,
  case paths, symbols, answers, outcomes, evidence lists, checking instructions,
  or repair steps.

  Return an empty operations list when evidence does not justify a durable
  change. Supported operations are ADD, REVISE, DELETE, and MERGE. Use MERGE
  only for language-level duplicates that express the same concern. Never
  merge merely related concerns.

  Before submitting, self-check every ADD, REVISE, and MERGE for atomicity,
  reusability, review-time observability, simple English, and length. Record the
  self-check briefly in reasoning. Do not assign IDs, modify counters, manage
  total length, or target one ID twice.

curator_instance: |
  <counted_playbook>{{ counted_internal_playbook }}</counted_playbook>

  {{ case_count }} final pair reflections are mounted read-only at
  {{ evidence_path }}. Read manifest.json and reflection_index.json, then read
  all of case_reflections.json before proposing operations.

  Write a JSON object with reasoning and operations to `/tmp/curator.json`.
  Choose zero or more operations; the following are alternative operation
  templates, not instructions to perform all of them:
  - ADD: type, content, category, supporting_instance_ids, risk_analysis.
  - REVISE: type, target_id, content, category, supporting_instance_ids, risk_analysis.
  - DELETE: type, target_id, supporting_instance_ids, risk_analysis.
  - MERGE: type, target_ids, content, category, supporting_instance_ids, risk_analysis.
  Replace the placeholders below with an evidence-based explanation and the
  chosen operation objects (an empty operations array is valid):
  {
    "reasoning": "<cross-pair synthesis and self-check>",
    "operations": ["<chosen operation objects, or an empty array>"]
  }
  ADD, REVISE, and MERGE require a nonempty category title.
  REVISE uses target_id and content; DELETE uses target_id; MERGE uses
  target_ids and content. Every operation also requires nonempty
  supporting_instance_ids and risk_analysis.

  Validate and submit using exactly one action containing:
  ```bash
  python3 -m json.tool /tmp/curator.json >/dev/null && echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/curator.json
  ```
  {% if retry_feedback %}
  Your prior artifact failed Host validation:
  <host_validation_feedback>{{ retry_feedback }}</host_validation_feedback>
  Correct that error, revalidate, and submit the complete corrected object.
  {% endif %}

refiner_system: |
  Reduce an overlength concern playbook only by removing redundant wording,
  rewording bullets more concisely, or merging language-level duplicates.
  Preserve every distinct concern and its category. Do not merge across categories.

  Use MERGE only when all target bullets express the same concern. Never combine
  distinct conditions, exceptions, examples, or concerns. Do not inspect cases,
  add knowledge, use or modify counters, assign IDs, delete a unique concern
  based on value, or choose pruning targets.

refiner_instance: |
  <overlength_playbook>{{ internal_playbook }}</overlength_playbook>
  <length current_tokens="{{ current_tokens }}"
          maximum_tokens="{{ maximum_tokens }}" />

  Output only:
  {"reasoning":"...","operations":[]}
