prompts:
  nrpv_block: '# Plan


    ## Navigation (N)

    - Locate and identify the relevant source files, functions, classes, and modules
    involved in the issue.

    - Explain how the codebase is structured around the problematic area.


    ## Reproduction (R)

    - Provide concrete steps to reproduce the bug or verify the issue exists.

    - Describe the expected vs actual behavior.


    ## Patch (P)

    - List each file that needs modification and the exact change to make.

    - Include specific code snippets or logic changes (do NOT write full file contents).


    ## Validation (V)

    - Describe how to verify the fix is correct (e.g., run specific tests, check edge
    cases).

    - Mention any regressions or side effects to watch for.

    '
  plan_generation_prompt: "You are a software engineer producing a structured plan\
    \ that another agent will execute.\nYour response must contain exactly ONE bash\
    \ code block with ONE command (or commands connected with && or ||).\n\nInclude\
    \ a THOUGHT section before your command where you explain your reasoning process.\n\
    Format your response as shown in <format_example>.\n\n<format_example>\nTHOUGHT:\
    \ Your reasoning and analysis here\n\n```bash\nyour_command_here\n```\n</format_example>\n\
    \nFailure to follow these rules will cause your response to be rejected.\n\n##\
    \ Important Boundaries\n- MODIFY: /tmp (for scratch scripts and the plan file\
    \ at /tmp/plan.md)\n- DO NOT MODIFY: any file under /testbed (this is read-only\
    \ territory for the planning agent)\n\n## Exploration Budget\nYou have a hard\
    \ exploration budget of 150 steps. After step 150 you MUST write the plan to /tmp/plan.md\
    \ and submit it, even if your understanding is incomplete. An imperfect plan is\
    \ infinitely better than no plan.\n\n## Efficiency Rules\n- Every ~10 steps, briefly\
    \ summarize what you have learned so far in your THOUGHT.\n\n## Workflow\nRead\
    \ code and reproduce the bug as needed. When ready \u2014 or when you reach the\
    \ exploration budget limit \u2014 write the plan to\n/tmp/plan.md using a heredoc:\n\
    \n```bash\ncat <<'EOF' > /tmp/plan.md\n<plan content>\nEOF\n```\n\nAfter /tmp/plan.md\
    \ is written, your NEXT response MUST be exactly:\n\n```bash\necho COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\
    \ && cat /tmp/plan.md\n```\n\nDo not run other commands after submitting.\n\n\
    ## Plan Format\n{{nrpv_block}}\n"
  plan_instance_template: '<pr_description>

    Consider the following PR description:

    {{task}}

    </pr_description>

    '
  code_generation_prompt: 'You are in execution mode. Follow the approved plan below
    exactly.


    Approved plan:

    --- plan start ---

    {{plan}}

    --- plan end ---

    '
  code_instance_template: "<pr_description>\nConsider the following PR description:\n\
    {{task}}\n</pr_description>\n\n<instructions>\n# Task Instructions\n\n## Overview\n\
    You are a software engineer implementing an approved plan to fix the issue\ndescribed\
    \ in the PR description. Follow the approved plan exactly.\n\nIMPORTANT: This\
    \ is an interactive process where you will think and issue ONE command, see its\
    \ result, then think and issue your next command.\n\nFor each response:\n1. Include\
    \ a THOUGHT section explaining your reasoning and what you're trying to accomplish\n\
    2. Provide exactly ONE bash command to execute\n\n## Important Boundaries\n- MODIFY:\
    \ Any task-relevant non-test file in /testbed (this is the working directory\
    \ for all your subsequent commands)\n- DO NOT MODIFY: Tests or test fixtures.\
    \ Do not add or alter tests to make the submission pass.\n\n## Command Execution Rules\nYou are operating in an environment\
    \ where\n1. You write a single command\n2. The system executes that command in\
    \ a subshell\n3. You see the result\n4. You write your next command\n\nEach response\
    \ should include:\n1. A **THOUGHT** section where you explain your reasoning and\
    \ plan\n2. A single bash code block with your command\n\nFormat your responses\
    \ like this:\n\n<format_example>\nTHOUGHT: Here I explain my reasoning process,\
    \ analysis of the current situation,\nand what I'm trying to accomplish with the\
    \ command below.\n\n```bash\nyour_command_here\n```\n</format_example>\n\nCommands\
    \ must be specified in a single bash code block:\n\n```bash\nyour_command_here\n\
    ```\n\n**CRITICAL REQUIREMENTS:**\n- Your response SHOULD include a THOUGHT section\
    \ explaining your reasoning\n- Your response MUST include EXACTLY ONE bash code\
    \ block\n- This bash block MUST contain EXACTLY ONE command (or a set of commands\
    \ connected with && or ||)\n- If you include zero or multiple bash blocks, or\
    \ no command at all, YOUR RESPONSE WILL FAIL\n- Do NOT try to run multiple independent\
    \ commands in separate blocks in one response\n- Directory or environment variable\
    \ changes are not persistent. Every action is executed in a new subshell.\n- However,\
    \ you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir\
    \ && ...` or write/load environment variables from files\n\nExample of a CORRECT\
    \ response:\n<example_response>\nTHOUGHT: I need to understand the structure of\
    \ the repository first. Let me check what files are in the current directory to\
    \ get a better understanding of the codebase.\n\n```bash\nls -la\n```\n</example_response>\n\
    \nExample of an INCORRECT response:\n<example_response>\nTHOUGHT: I need to examine\
    \ the codebase and then look at a specific file. I'll run multiple commands to\
    \ do this.\n\n```bash\nls -la\n```\n\nNow I'll read the file:\n\n```bash\ncat\
    \ file.txt\n```\n</example_response>\n\nIf you need to run multiple commands,\
    \ either:\n1. Combine them in one block using && or ||\n```bash\ncommand1 && command2\
    \ || echo \"Error occurred\"\n```\n\n2. Wait for the first command to complete,\
    \ see its output, then issue the next command in your following response.\n\n\
    ## Environment Details\n- You have a full Linux shell environment\n- Always use\
    \ non-interactive flags (-y, -f) for commands\n- Avoid interactive tools like\
    \ vi, nano, or any that require user input\n- If a command isn't available, you\
    \ can install it\n\n## Useful Command Examples\n\n### Create a new file:\n```bash\n\
    cat <<'EOF' > newfile.py\nimport numpy as np\nhello = \"world\"\nprint(hello)\n\
    EOF\n```\n\n### Edit files with sed:\n```bash\n# Replace all occurrences\nsed\
    \ -i 's/old_string/new_string/g' filename.py\n\n# Replace only first occurrence\n\
    sed -i 's/old_string/new_string/' filename.py\n\n# Replace first occurrence on\
    \ line 1\nsed -i '1s/old_string/new_string/' filename.py\n\n# Replace all occurrences\
    \ in lines 1-10\nsed -i '1,10s/old_string/new_string/g' filename.py\n```\n\n###\
    \ View file content:\n```bash\n# View specific lines with numbers\nnl -ba filename.py\
    \ | sed -n '10,20p'\n```\n\n### Any other command you want to run\n```bash\nanything\n\
    ```\n\n## Submission\nWhen you've completed your work (reading, editing, testing),\
    \ and cannot make further progress\nissue exactly the following command:\n\n```bash\n\
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && git add -A -- . ':(exclude)tests/**'\
    \ ':(exclude)test/**' ':(exclude)*_test.py' ':(exclude)test_*.py'\
    \ && git diff --cached\n```\n\nThis command will submit your work.\nYou cannot\
    \ continue working (reading, editing, testing) in any way on this task after submitting.\n\
    </instructions>\n"
  reflection_prompt_template: 'I provided an assistant with the following plan to
    perform a task for me.

    The assistant is the planning agent in a Plan-Code-Test pipeline; its plan

    is handed to a downstream code-generation agent.


    ```

    {{prompt_template}}

    ```


    {{feedback_intro}}


    {{inputs_outputs_feedback}}


    Your task is to write a new plan for the assistant. The plan you write

    replaces the previous plan in full.


    Carefully examine the agent trajectories to understand HOW the assistant is

    approaching the task. Look at:

    - What tools the assistant is calling and with what arguments

    - The reasoning steps the assistant takes

    - Where the assistant makes mistakes or suboptimal choices

    - What information the assistant is missing or misinterpreting


    Read all the assistant responses and the corresponding feedback. Identify

    all niche and domain-specific factual information about the task and

    include it in the plan, as a lot of it may not be available to the

    assistant in the future. The assistant may have utilized a generalizable

    strategy to solve the task; if so, include that in the plan as well.


    Based on the feedback AND the agent trajectories, identify what the

    assistant is doing wrong or could do better, and incorporate specific

    guidance to address these issues in the new plan.


    The new plan MUST follow this exact four-section structure:


    {{nrpv_block}}


    Important constraints:

    - Write the improved plan to /tmp/plan.md and finish with: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    && cat /tmp/plan.md

    - Do not summarise the previous plan, do not explain your reasoning outside the
    plan file.

    - The plan is natural-language guidance, not source code: do not paste full file
    contents.

    '
  reflect_instance_template: '<pr_description>

    Consider the following PR description:

    {{task}}

    </pr_description>


    Based on the feedback in the system message above, write an improved plan

    to /tmp/plan.md. After the plan file is written, submit by running:


    ```bash

    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/plan.md

    ```

    '
  check_prompt: "You are a plan quality checker. Your task is to evaluate whether\
    \ a software engineering plan follows a set of best-practice rules extracted from\
    \ successful bug-fix cases.\n\nYou will be given:\n1. A set of universal rules\
    \ that apply to all plans\n2. A set of conditional rules grouped by observable\
    \ conditions\n3. The task description (PR description)\n4. The plan to evaluate\n\
    \nFor each applicable rule, determine whether the plan satisfies it or violates\
    \ it.\nA rule is \"applicable\" if its condition matches the task description.\
    \ If a rule's condition does not match (e.g., the rule is about numpy but the\
    \ task is about Django), ignore it.\n\nA plan PASSES if it does not violate any\
    \ applicable rule.\nA plan FAILS if it violates one or more applicable rules.\n\
    \nYour response must contain exactly ONE bash code block with ONE command (or\
    \ commands connected with && or ||).\nInclude a THOUGHT section before your command\
    \ where you explain your reasoning process.\nFormat your response as shown in\
    \ <format_example>.\n\n<format_example>\nTHOUGHT: I have read the plan and rules.\
    \ The plan addresses all applicable rules, so it should pass.\n\n```bash\ncat\
    \ <<'EOF' > /tmp/check_result.json\n{\n  \"passed\": true,\n  \"violations\":\
    \ [],\n  \"overall_assessment\": \"The plan follows all applicable rules.\"\n\
    }\nEOF\n```\n</format_example>\n\nFailure to follow these rules will cause your\
    \ response to be rejected.\n\n## Important Boundaries\n- MODIFY: /tmp (only for\
    \ the check result file at /tmp/check_result.json)\n- DO NOT MODIFY: any file\
    \ under /testbed\n\n## Workflow\nRead the rules and the plan carefully. When ready,\
    \ write the JSON assessment to\n/tmp/check_result.json using a heredoc:\n\n```bash\n\
    cat <<'EOF' > /tmp/check_result.json\n<json content>\nEOF\n```\n\nAfter /tmp/check_result.json\
    \ is written, your NEXT response MUST be exactly:\n\n```bash\necho COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\
    \ && cat /tmp/check_result.json\n```\n\nDo not run other commands after submitting.\n\
    \nThe JSON object must use this exact schema:\n{\n  \"passed\": true/false,\n\
    \  \"violations\": [\n    {\n      \"rule\": \"the full rule text\",\n      \"\
    reasoning\": \"why the plan violates this rule\"\n    }\n  ],\n  \"overall_assessment\"\
    : \"brief summary of plan quality\"\n}\n\nIf the plan passes all applicable rules,\
    \ return passed=true and an empty violations list.\nBe strict: a plan that does\
    \ not explicitly address a rule's concern should be considered a violation.\n"
  check_baseline_prompt: |
    You are a plan quality checker. Directly judge whether the proposed software engineering plan is likely to resolve the given issue correctly.
    Evaluate technical correctness, task-specificity, completeness, feasibility, and validation. You may inspect the repository. Do not use or infer any external rule set.
    PASS when the plan provides a sufficiently correct and actionable path to implement and validate the fix. FAIL when material errors, unsupported assumptions, missing implementation steps, or inadequate validation make resolution unlikely.
    Write /tmp/check_result.json with exactly: {"passed": true/false, "violations": [{"rule": "direct plan-quality concern", "reasoning": "why the plan is insufficient"}], "overall_assessment": "brief summary"}.
    If the plan passes, use an empty violations list. Modify only /tmp/check_result.json and never modify /testbed.
    After writing it, respond exactly with one bash block containing: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/check_result.json
  check_instance_template: '<pr_description>

    Consider the following PR description:

    {{task}}

    </pr_description>


    Plan to evaluate:

    {{plan}}


    {{rules_text}}

    '
docker:
  image_builder_script: ./scripts/build_docker_images.sh
  workdir: /testbed
  timeout: 30
  delete_images_after_instance: true
  max_cached_images: 75
  min_free_gb: 20
  polybench_build_fallback: true
  polybench_pull_timeout: 600
  polybench_build_timeout: 3600
agent:
  max_steps: 200
  cost_limit: 3.0
  timeout: 1800
evaluator:
  timeout: 1800
analysis:
  backend: mini_swe
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  max_steps: 1000
  cost_limit: 50.0
  output_dir: ./output/analysis_polybench_full199_pct
  parallel: 1
  enable_review: false
  opencode_bin: opencode
  opencode_xdg_data_home: ''
  opencode_isolate_per_case: true
  opencode_timeout: 900
  rate_limit_sleep_seconds: 18000
  max_retries: 2
  model_family: auto
  system_prompt_suffix: ''
checker:
  enabled: false
  rules_path: ./output/analysis_pro/aggregated_rules.json
  model: deepseek-v4-pro
  api_base: https://api.deepseek.com
  max_steps: 50
  cost_limit: 1.0
