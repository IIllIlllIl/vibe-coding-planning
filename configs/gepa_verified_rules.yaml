paths:
  dataset_snapshot: output/SWE-bench_Verified/verified-round1-gepa-datasets/20260614_482_fdc056ae85df
  initial_rules: configs/gepa_initial_rules_minimal.md
  run_dir: output/SWE-bench_Verified/gepa-rules/offline-plan-verifier-balanced-b12-8it-20260722

checker:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 500
  cost_limit: 6.0
  timeout: 1800
  # Local Docker Desktop can transiently fail while pulling many large
  # SWE-bench images. Keep Checker retries higher than the HPC config.
  max_attempts: 5

reflection:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.7
  max_steps: 100
  cost_limit: 3.0
  timeout: 1800

search:
  # Full 384/98 snapshot, with exactly eight cumulative GEPA proposal
  # iterations after seed validation. The iteration stopper is the primary
  # experimental control. 1,074 metric calls is the worst-case projection
  # when all eight proposals pass the minibatch gate and receive full
  # validation: 98 + 8 * (12 parent + 12 proposal + 98 validation).
  # Keep a larger metric-call ceiling only as a fail-safe; reaching it before
  # eight durable iterations is an anomaly to audit rather than a normal stop.
  max_iterations: 8
  max_metric_calls: 2000
  projection_metric_calls: 1074
  reflection_minibatch_size: 12
  primary_metric: balanced_accuracy
  # Local Docker image acquisition is the bottleneck and Docker Desktop's
  # content store has been unstable under concurrent GEPA checker workers.
  # HPC Apptainer configs keep higher parallelism.
  parallel: 1
  seed: 42
  skip_perfect_score: false
  min_proposals: 1

docker:
  workdir: /testbed
  timeout: 30
  min_free_gb: 20
  max_cached_images: 75

prompts:
  checker_system: |
    You are a software plan verification assistant acting as a rule-bound
    binary decision-maker.

    Before implementation begins, decide whether a plan proposed by another
    agent should be approved as sufficiently likely to resolve the reported
    issue.

    Use the candidate rules as the only approval criteria. Do not add approval
    criteria from your own software-engineering knowledge. Use the issue, plan,
    and base-commit repository only as evidence for applying the candidate
    rules.

    Before deciding, inspect the repository and verify the plan's important
    factual claims.

    You may search and read repository files, inspect existing tests, run
    existing tests against the unmodified repository, and run temporary
    diagnostic or reproduction scripts outside the repository.

    Do not modify repository source or test files. Do not implement the
    proposed solution. Do not judge the plan using a patch you created. Do not
    report a plan claim as repository evidence unless you verified it.

    If the candidate rules and verified repository evidence do not clearly
    support approval, predict unresolved.

    Every response must contain exactly one shell action in one bash code block.
    When you have enough evidence, submit the result with one final action in
    this form:
    ```bash
    cat <<'EOF'
    COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    {
      "predicted_resolved": false,
      "decision_reason": "...",
      "repository_evidence": [
        {"path": "...", "symbol": "...", "finding": "..."}
      ]
    }
    EOF
    ```
    Do not run any other command after submitting.
  checker_instance: |
    <issue>
    {{task}}
    </issue>
    <plan>
    {{plan}}
    </plan>
    <candidate_rules>
    {{candidate_rules}}
    </candidate_rules>
  reflection_system: |
    You maintain the complete rule text used by a fixed rule-bound Checker.

    ## Optimization task

    The Checker receives an issue, a plan, candidate rules, and the repository
    at the base commit. It predicts resolved only when the plan and verified
    repository evidence satisfy the candidate rules. It must inspect the
    repository, but it must not modify repository source or test files or
    implement the proposed solution. Otherwise it predicts unresolved.

    At deployment time the Checker can use only:
    - the issue description;
    - the plan;
    - the candidate rules;
    - the repository at the specified base commit.

    It may generate new diagnostic evidence using read-only repository
    inspection, existing tests on the unmodified repository, and temporary
    scripts outside the repository.

    The Checker outputs predicted_resolved plus its reasoning and repository
    evidence. The optimization uses class-weighted correctness whose aggregate
    is balanced accuracy; incorrect predictions score zero, and correct
    predictions receive a split-specific weight for their historical class.

    ## Reflection evidence

    Files under {{evidence_path}} contain evaluation evidence for the current
    minibatch. They may include:
    - the Checker's complete trajectory, prediction, reasoning, and repository
      evidence;
    - the historical resolved label and correctness score;
    - Plan and Code Agent trajectories;
    - the generated patch;
    - evaluator and test results.

    Use execution-after evidence only to diagnose why the Checker was correct
    or incorrect and to maintain a generalizable plan-review checklist.

    ## Deployment boundary

    Every checklist item must be applicable using only the issue, plan,
    candidate rules, and permitted inspection of the base-commit repository.

    Checklist items must never require or assume access to:
    - the resolved label or correctness score;
    - Plan or Code Agent trajectories;
    - the generated patch;
    - evaluator or test results;
    - historical execution output, evaluator output, or an expected output.

    Do not memorize instance IDs, exact patches, labels, or task-specific
    answers.

    Do not place Checker tool permissions, repository mutation policy, output
    protocol, or other fixed execution instructions in the candidate rules.
    Those belong to the fixed Checker prompt, not the optimized plan-quality
    standard.

    ## Rule objective

    Maintain the candidate rules as a concise plan-review checklist. Each item
    should describe an observable criterion that a human reviewer and the
    Checker can apply using the issue, plan, and permitted repository
    inspection.

    Review all cases in the current minibatch, including correct and incorrect
    predictions. Consider false positives and false negatives separately.
    Preserve useful checklist items. Revise unclear or harmful items. Delete
    misleading items. Merge redundant or highly similar items that evaluate the
    same underlying property. Add new items only when they capture a general,
    deployment-visible criterion.

    Organize the final checklist under concise headings such as repository
    grounding, issue coverage, reasoning quality, change scope, validation
    quality, risk indicators, or other headings that better fit the maintained
    checklist.

    Do not generalize from a single case unless the lesson is clearly
    deployable beyond that case. Do not make the checklist broadly pessimistic.
    Do not output a Git patch, shell command, analysis narrative, or a solution
    for a single task.

    Every response must contain exactly one shell action in one bash code block.
    Submit the complete revised checklist directly, without a separate result
    file or analysis text:
    ```bash
    cat <<'EOF'
    COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    <complete revised checklist>
    EOF
    ```
  reflection_instance: |
    <current_rules>
    {{current_rules}}
    </current_rules>

    Evidence for the current minibatch is mounted read-only at:
    {{evidence_path}}

    For each case:
    1. Read the issue and plan from the Checker trajectory.
    2. Compare the Checker prediction with the historical resolved label.
    3. Inspect the Checker trajectory to identify reasoning errors or useful
       strategies.
    4. Use the Code trajectory, generated patch, and evaluator result only to
       explain why the prediction was correct or incorrect.
    5. Convert those findings into checklist items that the Checker can
       apply using only its deployment-visible inputs and permitted repository
       inspection.
