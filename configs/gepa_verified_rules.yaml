# One-iteration Offline protocol smoke for the conservative minimal seed, minimal
# Checker/Reflection responsibility boundary, and shared parser-exact mini-swe
# action protocol. This run is not a formal effectiveness result.
paths:
  dataset_snapshot: output/SWE-bench_Verified/verified-round1-gepa-datasets/20260614_482_fdc056ae85df
  initial_guideline: configs/gepa_initial_guideline_minimal.md
  run_dir: output/SWE-bench_Verified/gepa-rules/offline-plan-guideline-hpc-accuracy-b12-1it-parser-contract-smoke-20260805

checker:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 500
  cost_limit: 6.0
  timeout: 1800
  # One Slurm task owns one complete Checker Agent session. Infrastructure
  # retry happens by restarting that task from clean input.
  max_attempts: 1

reflection:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.7
  max_steps: 100
  cost_limit: 3.0
  timeout: 1800

search:
  # Full 384/98 snapshot and one GEPA proposal iteration after seed
  # validation. The iteration stopper is the primary experimental control.
  # 220 metric calls is the worst-case projection when the proposal passes the
  # minibatch gate and receives full validation:
  # 98 + 1 * (12 parent + 12 proposal + 98 validation).
  # Keep a larger metric-call ceiling only as a fail-safe; reaching it before
  # one durable iteration is an anomaly to audit rather than a normal stop.
  max_iterations: 1
  max_metric_calls: 300
  projection_metric_calls: 220
  reflection_minibatch_size: 12
  primary_metric: accuracy
  # Local-only adapter concurrency. HPC submits every Agent as an independent
  # Slurm array element and leaves scheduling entirely to Slurm.
  parallel: 1
  seed: 42
  # Keep proposing even when a sampled minibatch happens to score perfectly;
  # max_iterations remains the explicit experiment control.
  skip_perfect_score: false
  min_proposals: 1

docker:
  workdir: /testbed
  timeout: 30
  min_free_gb: 20
  max_cached_images: 75

container:
  runtime: apptainer
  module: tools/Apptainer
  sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  writable_tmpfs: true

execution:
  backend: hpc_slurm

hpc:
  submit: true
  remote_project_dir: ~/hpc_runs/vibe-coding-planning-offline
  remote_task_dir: /scratch/users/${USER}/vibe-coding-planning/offline-gepa-tasks
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  ulhpc_config: configs/ulhpc_submit.yaml
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: 00:35:00
  poll_interval_seconds: 300
  task_output_grace_seconds: 300
  missing_task_grace_seconds: 600
  max_task_attempts: 3
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: offline-guideline-parser-contract-1it-20260805
  worker_config_path: configs/gepa_verified_rules.yaml

prompts:
  checker_system: |
    You are a software development assistant evaluating a proposed plan before
    implementation begins.

    Decide whether the plan is sufficiently likely to resolve the reported
    issue.

    Treat the candidate guideline as the sole source of plan-review methods,
    software-engineering principles, heuristics, and decision criteria. Do not
    add or rely on review guidance that is not stated in the candidate
    guideline. Use your general capabilities only to apply the guideline and
    operate the provided environment.

    You receive the issue, the proposed plan, the candidate guideline, and a
    disposable repository at the base commit. The repository is available at
    /testbed. Its final state is discarded after this evaluation.

    ## Checker submission

    The repository is available at /testbed, not /repo.

    When ready, submit the result with one final action in this form:
    ```bash
    cat <<'EOF'
    COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    {
      "predicted_resolved": false,
      "decision_reason": "...",
      "repository_evidence": [
        {"path": "...", "symbol": "...", "finding": "..."}
      ]
    }
    EOF
    ```
    Submission finishes only when the executed command writes
    COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT as its first output line. Saying that
    the result was submitted does not finish the task. Do not run any other
    command after submitting.
  checker_instance: |
    <issue>
    {{task}}
    </issue>
    <plan>
    {{plan}}
    </plan>
    <candidate_guideline>
    {{candidate_guideline}}
    </candidate_guideline>
    {% if retry_feedback %}
    <retry_feedback>
    {{retry_feedback}}
    </retry_feedback>
    {% endif %}
  reflection_system: |
    ## Target artifact

    Optimize the complete standalone guideline that a developer or an Agent
    can use before implementation to decide whether a proposed software plan
    should proceed.

    The guideline must be self-contained. Do not assume that a separate
    Checker prompt will supply omitted review behavior, decision guidance, or
    software-engineering knowledge.

    Return the complete replacement guideline, not a patch or case analysis.

    ## Optimization evidence

    Files under {{evidence_path}} contain evidence for the current minibatch:
    - the complete review trajectory, prediction, reasoning, and repository
      evidence produced while applying the current guideline;
    - the historical resolved label and configured correctness score;
    - historical Plan and Code Agent trajectories;
    - the generated patch;
    - evaluator and test results.

    Use this evidence to understand the relevant repository behavior, what the
    proposed plan claims, what information the current review obtained or
    missed, and why its final decision matched or differed from the historical
    result. The benchmark repositories are not mounted in this Reflection
    container. Use repository files and command results captured in the saved
    trajectories and execution evidence. If those records do not support a
    repository claim, record the uncertainty instead of inventing the fact.

    ## Causal guideline optimization

    Review every case in the minibatch, including correct and incorrect
    predictions. For each case, identify how an instruction in the current
    guideline, or an important omission from it, affected information
    gathering, evidence processing, further investigation, stopping, or the
    final decision. Diagnose what should be preserved or changed and explain
    the expected behavioral effect of that change. Use the correctly handled
    cases to check whether a proposed change would damage useful behavior.

    Synthesize the complete replacement guideline from the cross-case causal
    analysis. You may add, revise, delete, combine, weaken, strengthen, or add
    exceptions to any guidance when supported by the evidence. Do not assume
    that a condition should always cause approval or rejection merely because
    it appeared in one case. Do not generalize from a single case unless the
    mechanism is clearly applicable beyond that case.

    Historical execution-after evidence is diagnostic evidence, not an input
    available when the guideline is deployed. An unrelated Code Agent,
    evaluator, or infrastructure failure is not by itself a reason to change
    the guideline; determine whether a deployment-visible plan or review
    behavior connects that evidence to a useful change.

    ## Deployment and generalization boundary

    The guideline may assume access only to the issue, proposed plan, and the
    repository being reviewed. It must not require historical labels, scores,
    Plan or Code trajectories, generated patches, evaluator results, or
    historical execution output.

    Do not copy instance IDs, repository names, task-specific paths or symbols,
    exact patches, labels, commands, or task answers into the guideline.
    Generalize the underlying review behavior or knowledge when the evidence
    supports it; otherwise omit it. Case analysis and change provenance belong
    only in the separate Reflection analysis.

    ## Reflection output and submission

    Before submission, write the complete case analysis to
    /tmp/reflection_analysis.json with this schema:
    - case_reviews: one object for every minibatch instance, containing
      instance_id, classification_outcome, repository_understanding,
      current_guideline_effect, review_behavior, diagnosis,
      proposed_guideline_effect, risk_to_correct_cases, and a non-empty
      evidence_used list;
    - guideline_changes: one or more objects containing operation (add, revise,
      delete, combine, preserve, weaken, strengthen, or add_exception),
      description, causal_rationale, expected_behavior_change,
      risk_to_correct_cases, and non-empty supporting_instance_ids.

    Example shape (replace placeholders and include every case):
    ```json
    {
      "case_reviews": [
        {
          "instance_id": "<instance_id>",
          "classification_outcome": "false_positive",
          "repository_understanding": "<relevant evidence-backed facts>",
          "current_guideline_effect": "<instruction or omission involved>",
          "review_behavior": "<information gathering, reasoning, stopping, and decision>",
          "diagnosis": "<evidence-grounded diagnosis>",
          "proposed_guideline_effect": "<expected behavior after revision>",
          "risk_to_correct_cases": "<possible harm or none found>",
          "evidence_used": [
            "manifest.json",
            "checker_output.json",
            "evaluator_result.json"
          ]
        }
      ],
      "guideline_changes": [
        {
          "operation": "revise",
          "description": "<guideline change>",
          "causal_rationale": "<cross-case or clearly generalizable mechanism>",
          "expected_behavior_change": "<how review behavior or judgment changes>",
          "risk_to_correct_cases": "<checked risk>",
          "supporting_instance_ids": ["<instance_id>"]
        }
      ]
    }
    ```

    After writing the analysis file, submit only the complete replacement
    guideline directly:
    ```bash
    cat <<'EOF'
    COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    <complete revised guideline>
    EOF
    ```
    Submission finishes only when the executed command writes
    COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT as its first output line. The
    structured analysis is experimental evidence only; do not include it in
    the candidate guideline.
  reflection_instance: |
    <current_guideline>
    {{current_guideline}}
    </current_guideline>

    Evidence for the current minibatch is mounted read-only at:
    {{evidence_path}}

    Evidence layout:
    - {{evidence_path}}/manifest.json
      - cases[].instance_id
      - cases[].expected_resolved
      - cases[].score
    - {{evidence_path}}/<instance_id>/checker_output.json
      - predicted_resolved
      - decision_reason
      - repository_evidence
      - trajectory, including the issue and plan seen by the Checker
    - {{evidence_path}}/<instance_id>/plan_trajectory.json
      - messages
    - {{evidence_path}}/<instance_id>/code_trajectory.json
      - messages
    - {{evidence_path}}/<instance_id>/generated.patch
    - {{evidence_path}}/<instance_id>/evaluator_result.json
      - resolved
      - report
      - stdout
      - stderr

    Read manifest.json first. Do not submit until every manifest case has a
    corresponding case_reviews entry. Do not guess alternative filenames.

    For each case:
    1. Read checker_output.json and compare predicted_resolved with the
       historical label in manifest.json to classify the case as TP, TN, FP,
       or FN.
    2. For every FP and FN, read the issue and plan from checker_output.json,
       inspect the complete Checker trajectory, and use Code trajectory,
       generated patch, and evaluator result to diagnose the error.
    3. For TP and TN cases, inspect the Checker reason and repository evidence,
       then inspect additional raw evidence when needed to test whether a
       proposed change would damage correct behavior.
    4. Record the files actually consulted in evidence_used. Do not claim to
       have used a file that you did not read. Every case must name
       manifest.json and checker_output.json; FP and FN cases must also name
       evaluator_result.json.
    5. Explain how the current guideline affected the review's actions,
       reasoning, stopping, or decision, and what behavior a proposed change
       is expected to alter.
    6. Check each proposed change against the correctly handled cases and
       record any plausible regression risk.
    7. Link every guideline change to its supporting case reviews, then
       generalize the causal mechanism into guidance deployable using only the
       issue, plan, and repository.
