mode: online_planning

paths:
  dataset_snapshot: output/archive/datasets/historical/gepa-pilot-datasets/pilot_6_4_seed42_73df941adb4d
  initial_rules: configs/gepa_initial_rules_gpt_seed.md
  run_dir: output/SWE-bench_Verified/gepa-rules/online-planning-pilot

dataset:
  name: SWE-bench/SWE-bench_Verified

plan:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  timeout: 1800

code:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  timeout: 1800

reflection:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.7
  max_steps: 500
  cost_limit: 10.0
  timeout: 1800

search:
  max_metric_calls: 30
  projection_metric_calls: 300
  reflection_minibatch_size: 3
  seed: 42
  parallel: 1
  skip_perfect_score: false
  min_proposals: 1

docker:
  workdir: /testbed
  timeout: 1800
  delete_images_after_instance: false
  min_free_gb: 20
  max_cached_images: 75

container:
  runtime: docker

evaluator:
  timeout: 1800

prompts:
  plan_system: |
    You are a strict planning agent. Produce a structured plan that another
    agent will execute.

    Use the supplied planning rules as the primary planning checklist. You may
    inspect the repository and make conservative engineering inferences when a
    rule does not cover a detail, but do not present unsupported assumptions as
    facts.

    Your response must contain exactly ONE bash code block with ONE command
    (or commands connected with && or ||).

    Include a THOUGHT section before your command where you explain your
    reasoning process.

    Failure to follow these rules will cause your response to be rejected.

    Do not modify files under /testbed. Use /tmp only for scratch work and the
    final plan file.

    ## Efficiency Rules
    - Every ~10 steps, briefly summarize what you have learned so far in your
      THOUGHT.

    ## Workflow
    Read code and reproduce the bug as needed. When ready -- or when you reach
    the exploration budget limit -- write the plan to /tmp/plan.md using a
    heredoc:

    ```bash
    cat <<'EOF' > /tmp/plan.md
    <plan content>
    EOF
    ```

    After /tmp/plan.md is written, your NEXT response MUST be exactly:

    ```bash
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/plan.md
    ```

    Do not run other commands after submitting.

    ## Plan Format
    {{nrpv_block}}

  plan_instance: |
    <planning_rules>
    {{planning_rules}}
    </planning_rules>

    <pr_description>
    Consider the following PR description:
    {{task}}
    </pr_description>

  code_system: |
    You are in execution mode. Follow the approved plan below exactly.

    Approved plan:
    --- plan start ---
    {{plan}}
    --- plan end ---

  code_instance: |
    <pr_description>
    Consider the following PR description:
    {{task}}
    </pr_description>

    <instructions>
    Implement the approved plan in /testbed. You may create or modify tests and
    fixtures to reproduce the issue and validate the implementation. Do not
    weaken or skip assertions merely to make an incorrect implementation pass.

    You are responsible for selecting the final patch. Inspect all changes,
    clear the staging area, and use an earlier command to stage exactly the
    changes you intend to send to the clean official evaluator. Diagnostic
    tests and temporary debugging artifacts may remain unstaged. Then submit:
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && git diff --cached --binary --full-index
    </instructions>

  reflection_system: |
    You synthesize planning rules from repo-grounded instance reviews. First
    list {{evidence_path}}, then read manifest.json and every
    instance_review.json. Distinguish plan defects from Code, evaluator,
    infrastructure, and uncertain attribution. Add only general lessons that a
    Plan Agent can apply using the issue and repository before Code runs. A
    justified unchanged checklist is valid.

    Write /tmp/reflection_analysis.json with reviewed_instance_ids,
    accepted_lessons, rejected_lessons, proposal_changed, and no_change_reason.
    Write the complete checklist to /tmp/candidate_rules.txt. Use exactly one
    bash code block per response. Submit with:
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/candidate_rules.txt

  reflection_instance: |
    <current_rules>
    {{current_rules}}
    </current_rules>

    Evidence for the current minibatch is mounted read-only at:
    {{evidence_path}}

  reflection_reviewer_system: |
    Review exactly one rollout; do not rewrite the global checklist. First list
    {{evidence_path}}, read task.md, repository.json, current_rules.md,
    generated_plan.md, rollout_summary.json, evaluator_result.json, and
    generated.patch, then inspect trajectories and {{repository_path}} for
    concrete attribution questions. Compare issue -> plan -> Code -> patch ->
    evaluator. Attribute to plan, code, evaluator, infrastructure, or uncertain.

    Form explicit attribution questions and use targeted repository interaction
    to answer them. Inspect the untouched base first. When useful, run a focused
    reproduction or existing test, write a temporary diagnostic test or script,
    apply generated.patch, or make a small counterfactual edit. All changes are
    disposable and never become a submission. Keep observations from base,
    generated_patch, and counterfactual observations clear in your reasoning.

    Write {{output_path}} as JSON with exactly: instance_id; plan_assessment
    containing correct, missing_or_wrong, and repository_findings strings;
    code_plan_alignment; outcome_attribution; planning_lesson; uncertainty.
    The evaluator and saved raw artifacts remain authoritative for outcome.
    Use exactly one bash code block per response. Submit with:
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat {{output_path}}

  reflection_reviewer_instance: |
    Instance {{instance_id}} is from {{repository}} at {{base_commit}}.
    Current rules:
    {{current_rules}}
    Evidence: {{evidence_path}}
    Repository: {{repository_path}}
    Output: {{output_path}}

  nrpv_block: |
    Your plan must include:
    - Navigation: files, symbols, and repository areas to inspect.
    - Reproduction: how to understand or reproduce the reported behavior.
    - Patch: the narrowly scoped implementation strategy.
    - Validation: checks tied to the reported behavior.
