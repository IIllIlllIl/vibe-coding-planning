# Prototype schema, not a launch authorization or an executable frozen dataset.
paths:
  dataset_snapshot: .local/operations/codex-pce-research/inputs
  safe_pce_config: .local/operations/codex-pce-research/inputs/pce_source/base_pce.yaml
  seed_guide: configs/prompts/planning_guide_seed.md
  run_dir: .local/operations/codex-pce-research/run
goal: |
  Develop a readable, reusable planning guide that helps a Planner produce
  approaches leading to correct implementations across software tasks.
  For each task, the Planner receives the guide and frozen repository. A fresh
  Coder implements its Plan, and the fixed benchmark evaluator assigns one
  point for a resolved task and zero otherwise. Use the training experiments
  and their history to improve the guide. Validation feedback reports the
  aggregate resolved count on a fixed held-out selection.
  The guide is your only editable scientific artifact. Data splits, execution
  and scoring are fixed. Pursue improvement within the approved experiment budget.
max_updates: 2
execution:
  backend: local
analysis:
  sif_path: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache/codex-inspection_python312-rg14-v1.sif
  sif_sha256: b383e57e939505cdd158205066e495f6e3ca7e9932000f1a1d3fe3e26a1f0277
  model:
    executor: codex_cli
    codex_binary: ${HOME}/.local/lib/vibe-codex/0.160.1/bin/codex
    codex_auth_file: ${HOME}/.codex/auth.json
    codex_version: 0.160.1
    model: gpt-6-sol
    reasoning_effort: high
