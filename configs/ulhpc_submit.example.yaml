# Copy to configs/ulhpc_submit.yaml and replace placeholders before submitting.
# This follows ../../hpc_submit/examples/config.yaml, with project-specific
# excludes and local log placement.
host: access-iris.uni.lu
port: 8022
user: YOUR_USERNAME
remote_project_dir: ~/hpc_runs/{project_name}
default_partition: batch
default_time: "01:00:00"
default_nodes: 1
default_ntasks: 1
default_cpus_per_task: 1
default_mem: 8G
conda_module: miniconda3
python_module: lang/Python/3.11
container_module: apptainer
log_dir: ./.tmp_hpc_smoke/ulhpc-runs
# Optional if you do not use ssh-agent:
# ssh_key: ~/.ssh/id_rsa
# ssh_key_passphrase: null
sync_excludes:
  - ".git"
  - "__pycache__"
  - "*.pyc"
  - ".env"
  - ".coverage"
  - ".pytest_cache"
  - ".mypy_cache"
  - ".ruff_cache"
  - "htmlcov"
  - "logs"
  - ".tmp_hpc_smoke"
  - ".claude"
  - ".ulhpc_submit"
  - "output"
  - "third_party/swe-bench-pro-os"
  - "swe-bench-pro-os"
