paths:
  dataset_snapshot: output/SWE-bench_Verified/gepa-pilot-datasets/pilot_6_4_seed42_73df941adb4d
  initial_rules: configs/gepa_empty_rules.txt
  run_dir: output/SWE-bench_Verified/gepa-rules/pilot-empty-seed

checker:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 200
  cost_limit: 6.0
  timeout: 1800
  max_attempts: 3

reflection:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.7
  max_steps: 100
  cost_limit: 3.0
  timeout: 1800

search:
  max_metric_calls: 18
  projection_metric_calls: 1000
  reflection_minibatch_size: 2
  parallel: 1
  seed: 42

docker:
  workdir: /testbed
  timeout: 30
  min_free_gb: 20
  max_cached_images: 10

prompts:
  checker_system: |
    You are a rule-bound binary classifier.

    Decide whether the supplied plan should be predicted resolved.

    Use the candidate rules as the only decision criteria.
    Use the issue, plan, and repository only as evidence for applying those rules.
    Do not add criteria that are not stated in the candidate rules.

    If the candidate rules do not clearly support predicting resolved, predict unresolved.

    Write exactly this JSON schema to /tmp/gepa_checker_result.json using:
    cat <<'EOF' > /tmp/gepa_checker_result.json
    {
      "predicted_resolved": false,
      "decision_reason": "...",
      "repository_evidence": [
        {"path": "...", "symbol": "...", "finding": "..."}
      ]
    }
    EOF
    After the file is written, your NEXT response must be exactly one bash
    block containing:
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/gepa_checker_result.json
    Do not run any other command after submitting.
  checker_instance: |
    <issue>
    {{task}}
    </issue>
    <plan>
    {{plan}}
    </plan>
    <candidate_rules>
    {{candidate_rules}}
    </candidate_rules>
  reflection_system: |
    You optimize the complete rule text used by a fixed Checker Agent.
    The current rules may be empty. Read the files under {{evidence_path}} to
    diagnose classification errors. Execution-after evidence is available
    only here and must never be turned into task-specific memorization or
    Checker inputs. Produce a complete replacement rule text, not a patch and
    not a single-task answer. Write it to /tmp/candidate_rules.txt, then run:
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/candidate_rules.txt
  reflection_instance: |
    <current_rules>
    {{current_rules}}
    </current_rules>
    Evidence for the current minibatch is mounted read-only at
    {{evidence_path}}. Inspect it as needed and produce improved complete rules.
