models:
  checker: {model: deepseek-v4-flash, temperature: 0.0}
  reflector: {model: deepseek-v4-flash, temperature: 0.0}
  curator: {model: deepseek-v4-flash, temperature: 0.0}
  refiner: {model: deepseek-v4-flash, temperature: 0.0}

repo_checker:
  workdir: /testbed
  command_timeout_seconds: 1800
  source_access_policy: conservative_blacklist_v3
  prune_future_history: true
  masked_container_paths:
    - /opt/miniconda3/pkgs

scoring:
  accept_resolved: 1
  accept_unresolved: 0
  reject_resolved: -1
  reject_unresolved: 1
  invalid: -100

search:
  max_iterations: 1
  reflection_minibatch_size: 8
  max_metric_calls: 48
  seed: 42
  perfect_score: 1.0
  skip_perfect_score: true

reflection:
  rounds: 1
  evidence_image: python:3.12-slim
  evidence_sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  command_timeout_seconds: 1800

length:
  maximum_visible_tokens: 2048
  maximum_bullet_tokens: 64
  harmful_pruning_weight: 2

budget:
  candidate_proposals: 1
  reflection_cases_per_proposal: 8
  reflection_rounds_per_case: 1
  projected_metric_call_ceiling: 48

stopping:
  stop_after_candidate_proposals: 1
  abort_on_operational_incomplete: true

operational_incomplete_policy: >-
  Model, transport, timeout, parsing, missing-artifact, repository-authority,
  or exhausted Agent-output-contract failures remain operationally incomplete
  and are not converted to unresolved, Bad, or INVALID. INVALID is reserved
  for a structurally valid candidate containing a bullet over 64 Checker
  tokens.

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  controller_slice_time: "00:30:00"
  agent_time: "00:35:00"
  poll_interval_seconds: 30
  max_running_array_tasks: 0
  max_task_attempts: 3
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: verified-repo-concern-playbook-smoke8-v1-20260915

success_criteria:
  - The old no-repository Checker mode and its prompt/data boundary remain unchanged.
  - Each Repo Checker task receives only issue, Plan, visible concern text, frozen repository identity, and frozen SIF authority.
  - The Repo Checker returns one 0/1/2 case finding per triggered concern and the Host rejects only for Level 2.
  - Level 0 and Level 1 findings do not affect the candidate score; their observed quality is retained for smoke analysis.
  - Repo Reflection receives repository access and retrospective evidence, while the Curator receives only completed structured reflections.
  - The Checker sees neither outcomes, Code/evaluator trajectories, stable IDs, nor counters.
  - Every repository Agent uses a disposable base-commit worktree and an isolated artifact channel.
  - Exactly one candidate proposal is attempted from eight balanced development cases and evaluated on four balanced development-validation cases.

readiness:
  runnable: true
  launched: false
  missing: []
