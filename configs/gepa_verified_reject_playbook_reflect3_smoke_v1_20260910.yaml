schema_version: 1
mode: offline_reject_playbook
status: ready_not_launched
run_id: verified-reject-playbook-reflect3-smoke-v1-20260910
purpose: validate three sequential per-case Reflection rounds within an approximately 20-minute smoke

paths:
  dataset_snapshot: configs/frozen_swe_verified_playbook_gepa/20260910_clean436_4c0e9c40440e
  initial_rules: configs/development_guidelines/offline_gepa_reject_playbook_seed_v1.json
  run_dir: output/SWE-bench_Verified/gepa-reject-playbook-runs/reflect3-smoke-v1-20260910

task:
  semantics: offline_reject_playbook_v3

container:
  runtime: none
  sif_cache_dir: /scratch/users/twang/vibe-coding-planning/shared/sif-cache

execution:
  backend: hpc_slurm

inputs:
  dataset_snapshot: configs/frozen_swe_verified_playbook_gepa/20260910_clean436_4c0e9c40440e
  initial_playbook: configs/development_guidelines/offline_gepa_reject_playbook_seed_v1.json
  initial_playbook_sha256: da2676ca8b9a4d78e0d3d21bb560650c4d9aafe616088e3d00f8e18f2a3d4e7e
  prompt_bundle: configs/prompts/offline_gepa_reject_playbook_v3_20260910.yaml
  prompt_bundle_sha256: afd3838b014ab650239eec41dc7df047c2b0615f2bc03e7f3888bda7eac9d596
  train_instance_ids:
    - astropy__astropy-12907
    - astropy__astropy-13033
  validation_instance_ids:
    - django__django-10554

models:
  checker: {model: deepseek-v4-flash, temperature: 0.0}
  reflector: {model: deepseek-v4-flash, temperature: 0.0}
  curator: {model: deepseek-v4-flash, temperature: 0.0}
  refiner: {model: deepseek-v4-flash, temperature: 0.0}

search:
  max_iterations: 1
  reflection_minibatch_size: 1
  max_metric_calls: 5
  seed: 42
  perfect_score: 0.0
  skip_perfect_score: true

reflection:
  rounds: 3
  rounds_are_configurable: true
  evidence_image: python:3.12-slim
  evidence_sif_cache_dir: /scratch/users/twang/vibe-coding-planning/shared/sif-cache
  max_steps: 20
  command_timeout_seconds: 120

length:
  maximum_visible_tokens: 10000
  maximum_bullet_tokens: 128

stopping:
  stop_after_candidate_proposals: 1
  abort_on_operational_incomplete: true

success_criteria:
  - The selected nonzero-loss case receives exactly three completed Reflection rounds.
  - Reflection rounds execute as three sequential singleton Slurm waves for the same case.
  - Round 2 receives the durable round-1 reflection as prior reflection evidence.
  - Round 3 receives the durable round-2 reflection as prior reflection evidence.
  - Each round retains the repository-free evidence boundary and complete per-bullet attribution.
  - Curator receives the final per-case reflection and a correctly updated counted playbook.
  - Checker, Curator, checkpoint, retry, and controller-yield contracts remain unchanged.
  - The smoke normally completes in about 20 minutes, excluding Slurm queue delay.

operational_incomplete_policy: >-
  Model, transport, timeout, parsing infrastructure, missing-artifact, or
  exhausted Agent-output-contract failures are operationally incomplete and
  are not converted to Bad or INVALID.

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  controller_slice_time: "00:30:00"
  agent_time: "00:35:00"
  poll_interval_seconds: 30
  max_running_array_tasks: 4
  max_task_attempts: 2
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: verified-reject-playbook-reflect3-smoke-v1-20260910

readiness:
  runnable: true
  launched: false
  expected_runtime_minutes_excluding_queue: 20
  missing: []
