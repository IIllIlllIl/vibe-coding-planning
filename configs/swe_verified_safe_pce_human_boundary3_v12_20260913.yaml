# Three-case rerun of the nonterminal v11 cases with semantic Plan boundaries.
mode: swe_verified_pce
purpose: safe_pce_human_semantic_plan_boundary_smoke

paths:
  dataset_snapshot: output/SWE-bench_Verified/swe-verified-pce-inputs/20260831_verified500_91aa3ed5
  image_manifest: configs/frozen_swe_verified_smoke/safe-pce-human-boundary3-v1-20260913-images.json
  selection_manifest: configs/frozen_swe_verified_smoke/swe-verified-safe-pce-human-boundary3-v1-20260913.json
  prompt_source_config: configs/polybench_pce_hpc_formal_clean_20260825.yaml
  plan_prompt_source_config: configs/prompts/swe_verified_safe_pce_planner_v6_anchor_ablation_20260913.yaml
  code_prompt_source_config: configs/prompts/swe_verified_safe_pce_code_v1_20260913.yaml
  run_dir: output/SWE-bench_Verified/swe-verified-pce-runs/development/safe-pce-human-boundary3-v12-20260913

plan:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 0
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 3
  submission_protocol: direct_human_markdown_v5

code:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 0
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 3

docker:
  workdir: /testbed
  timeout: 1800
  min_free_gb: 20
  max_cached_images: 75

container:
  runtime: apptainer
  module: tools/Apptainer
  sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  writable_tmpfs: true

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: "00:45:00"
  poll_interval_seconds: 300
  task_output_grace_seconds: 300
  missing_task_grace_seconds: 600
  max_task_attempts: 3
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: swe-verified-safe-pce-human-boundary3-v12-20260913
  worker_config_path: configs/swe_verified_safe_pce_human_boundary3_v12_20260913.yaml

evaluator:
  slurm_timeout_outcome: unknown

experiment_contract:
  status: launch_authorized
  selected_cases: 3
  selection: frozen_outcome_exposed_v11_nonterminal_cases
  repositories: 2
  comparison_run: safe-pce-terminal10-v11-20260913
  method_change:
    - replace_FINAL_PLAN_with_symmetric_START_PLAN_marker
    - state_that_bounded_markdown_is_shown_directly_and_verbatim_to_human_developer
  held_constant:
    - frozen_issue_rows_and_sif_bytes
    - planner_task_semantics
    - code_prompt
    - model_and_temperature
    - source_and_repository_boundaries
    - slurm_resources_and_retry_policy
  plan_prompt_text_sha256: dac5af971a23630878f3a223a15a55f308c020762603fd76db2f5599127af4e1
  plan_action_protocol_text_sha256: ce1781dbbf5a8d4633e59f82e5969e1dee176e54f3dd251acfa45ae8e6c64b3e
  code_prompt_text_sha256: cf626bf468fe674e53cc81640083bb674ce6536a7b4b9e575e41ece6ac6ef6f3
  code_instance_prompt_text_sha256: fb9cc998e7c3e7484ce5c19b3c355dc899e9fcd774b3c5080a98c1a16e4a8fc0
  plan_authority: exact_model_text_between_START_PLAN_and_END_PLAN
  raw_plan_authority: complete_model_terminal_response_with_sha256
  plan_submission_protocol: direct_human_markdown_v5
  plan_format: standalone_task_adaptive_markdown_without_required_nrpv_sections
  plan_audience: human_developer_before_implementation
  plan_search_strategy: four_instruction_anchor_ablation
  local_git_history_policy: multilingual_timesafe_base_and_ancestors
  repository_baseline_command_timeout: inherit_phase_1800_seconds
  agent_source_policy: conservative_blacklist_v3
  source_audit_index: all_attempts_case_level_summary_plus_event_logs
  source_audit_disposition: no_training_authority_until_case_level_review
  shell_command_parser: bashlex_ast_with_observed_timeout_wrapper
  prompt_url_source: literal_http_urls_in_frozen_issue_description
  non_prompt_http_policy: allow_but_review
  agent_filesystem_policy: complete_testbed_with_host_cwd_disabled_and_package_cache_masked
  evaluator_repository_policy: verify_fresh_immutable_sif_without_reset_or_clean
  evaluator_source_policy: none
  historical_run_inputs: none
  known_limitations:
    - lightweight_source_policy_is_not_a_security_sandbox
    - runtime_generated_source_commands_require_post_filtering
    - django_10554_may_exhaust_worker_walltime_during_planning
  budget:
    cases: 3
    planner_and_code_command_timeout_seconds: 1800
    slurm_worker_walltime: "00:45:00"
    agent_attempts: 3
    supervisor_slices: 12
  success_criteria:
    - all three cases reach terminal or explicitly operationally incomplete outcomes
    - valid submissions begin with START_PLAN and end with END_PLAN
    - only exact Markdown between the markers enters the Plan checkpoint and Code input
    - malformed boundaries and protocol residue retry without Host rewriting
    - compare boundary compliance and Planner depth against the same v11 cases
  stopping: finish_all_three_cases_or_report_operational_incomplete
  operational_incomplete_policy: transport_provider_timeout_or_infrastructure_failure_is_not_unresolved
  launched: true
