# No-Agent Base/Gold calibration only. This is not a PCE launch config.
schema_version: 1
mode: swe_rpg_pce
paths:
  dataset_snapshot: output/SWE-RPG/pce-inputs/python78-v1-20261024
  image_manifest: configs/frozen_swe_rpg/python78-sif-audited-v1-20261014/images.json
  selection_manifest: configs/frozen_swe_rpg/history-python3-v1-20261024/selection.json
  prompt_source_config: configs/polybench_pce_hpc_formal_clean_20260825.yaml
  plan_prompt_source_config: configs/prompts/swe_verified_safe_pce_planner_v6_anchor_ablation_20260913.yaml
  code_prompt_source_config: configs/prompts/swe_verified_safe_pce_code_v1_20260913.yaml
  run_dir: /scratch/users/twang/vibe-coding-planning/run_state/operations/swe-rpg-evaluator-python3-v1-20261024
plan:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 1.0
  thinking: disabled
  max_steps: 0
  cost_limit: 0.0
  timeout: 900
  max_attempts: 3
  submission_protocol: direct_human_markdown_v5
code:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 0
  cost_limit: 0.0
  timeout: 900
  max_attempts: 3
docker:
  workdir: /testbed  # The Case supplies /testbed or /testbed2.
  timeout: 900
  min_free_gb: 20
  max_cached_images: 75
container:
  runtime: apptainer
  module: tools/Apptainer
  sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  writable_tmpfs: true
hpc:
  submit: false
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: "01:00:00"  # Unused PCE worker field; diagnostic budget is below.
  max_running_array_tasks: 3
  max_task_attempts: 3
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  worker_config_path: configs/swe_rpg_evaluator_python3_v1_20261024.yaml
evaluator:
  slurm_timeout_outcome: unknown
experiment_contract:
  purpose: official_rpg_base_gold_calibration_only
  launch_authorized: false
  diagnostic_launch_authorized: true
  diagnostic_budget:
    cluster: iris
    cpus_per_case: 1
    memory_per_case: 4G
    walltime_per_case: "00:30:00"
    cases: 3
    evaluator_calls: 6
    model_calls: 0
  entry_point: scripts.tools.verify_swe_rpg_evaluator
  input_subset_source: configs/preheat_swe_rpg_python3_smoke_20261012.json
  base_gold_use_separate_fresh_workspaces: true
  official_scoring_unchanged: true
  network_policy: preserve_official_commands_and_runtime_default
  raw_operational_failures_retained: true
  acceptance:
    - each_case_base_is_unresolved_with_nonpassing_fail_to_pass_evidence
    - each_case_gold_is_resolved_under_original_official_scoring
    - retain_explicit_failures_missing_skips_and_all_stage_exit_codes
    - no_planner_coder_checker_or_learning_role_is_invoked
