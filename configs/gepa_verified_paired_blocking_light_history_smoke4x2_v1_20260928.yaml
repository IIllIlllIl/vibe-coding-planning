operational_incomplete_policy: Model, subscription, transport, timeout, parsing, missing-artifact, repository-authority,
  or exhausted Agent-output-contract failures remain operationally incomplete. Host validation retries invalid
  Agent artifacts; it does not rewrite them into scientific outcomes. A subscription-usage interruption pauses
  this run for checkpointed resume; it is not a scientific score or a reason to resample completed Agents.
