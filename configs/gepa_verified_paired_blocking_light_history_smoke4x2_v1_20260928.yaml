  partition: batch
  cpus_per_task: 1
  mem: 4G
  controller_slice_time: 00:30:00
  agent_time: 00:15:00
  poll_interval_seconds: 30
  max_running_array_tasks: 0
  max_task_attempts: 2
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: blocking-light-history4x2-v1-20260928
success_criteria:
- Run two complete proposals from a fresh state; do not import earlier Checker, Ref/Cur, or candidate results.
- Check all 31 parent bullets for every Plan and retain raw trajectory and rejected outputs.
- Verify rejected multi-block actions execute nothing and retry feedback instructs re-execution; do not silently
  repair Agent outputs.
- After valid training Reflection, verify global helpful/harmful/neutral counters and history; iteration-two
  Curator receives the index and can read earlier explanations.
- Confirm validation data never updates training history. Candidate validation is conditional on a strict minibatch
  improvement.
- Use no-thinking DeepSeek Checker, unchanged GPT-6 Sol/high Ref/Cur prompts, refiner disabled, Iris 1 CPU
  / 4G, 15-minute Agent tasks and no array concurrency cap.
readiness:
  runnable: true
  launched: false
  missing: []
  validation_scope: Local frozen inputs pass validation. Iris read-only preflight found five SIF files with the
    frozen byte sizes, their prepared base-history bundle paths, an evidence SIF, and no existing target run
    directory. Worker validation still checks hashes. No LLM, Slurm, Apptainer or supervisor run is authorized
    by this preparation.
launch_checks:
- Commit a clean worktree before launch.
- Verify frozen input SHA-256 and task-disjoint train/validation selection.
- Verify all selected image/history and Codex evidence SIF artifacts are present on Iris.
- Confirm no active supervisor owns this run directory; then submit the new supervisor only on explicit request.
audit_targets:
- Observe actual tool-action execution and recovery, not just JSON schema completion.
- Check that repository citations have real received observations and that failed actions are not treated as observations.
- Verify two fresh Reflector/Curator waves and that the second Curator can inspect first-round history.
- Verify neutral feedback, idempotent counter updates, and absence of validation evidence in the global ledger.
