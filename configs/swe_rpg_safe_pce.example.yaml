# Source-adapter example only: no approved split, Supervisor, or launch budget.
# Prepare the immutable source with scripts.tools.prepare_swe_rpg_pce first.
schema_version: 1
mode: swe_rpg_pce
paths:
  dataset_snapshot: output/SWE-RPG/pce-inputs/python78-v1-20261024
  image_manifest: configs/frozen_swe_rpg/python78-sif-audited-v1-20261014/images.json
  selection_manifest: output/SWE-RPG/pce-inputs/python78-v1-20261024/selection.json
  prompt_source_config: configs/polybench_pce_hpc_formal_clean_20260825.yaml
  plan_prompt_source_config: configs/prompts/swe_verified_safe_pce_planner_v6_anchor_ablation_20260913.yaml
  code_prompt_source_config: configs/prompts/swe_verified_safe_pce_code_v1_20260913.yaml
  run_dir: output/SWE-RPG/pce-adapter-example
plan:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 1.0
  thinking: disabled
  max_steps: 0
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 3
  submission_protocol: direct_human_markdown_v5
code:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 0
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 3
docker:
  workdir: /testbed  # Runner binds the frozen per-case /testbed or /testbed2.
  timeout: 1800
  min_free_gb: 20
  max_cached_images: 75
container:
  runtime: apptainer
  module: tools/Apptainer
  sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  writable_tmpfs: true
hpc:
  submit: false
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: "01:00:00"
  max_running_array_tasks: 3
  poll_interval_seconds: 120
  task_output_grace_seconds: 300
  missing_task_grace_seconds: 600
  max_task_attempts: 3
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: swe-rpg-pce-example
  worker_config_path: configs/swe_rpg_safe_pce.example.yaml
evaluator:
  slurm_timeout_outcome: unknown
experiment_contract:
  launch_authorized: false
  engineering_baseline: configs/gepa_safe_pce_verified_codex_smoke_v5_20261024.yaml
  agent_baseline: configs/safe_pce_ace_verified_smoke_source_v1_20261022.yaml
  official_scoring_unchanged: true
  reference_artifacts_in_agent_inputs: false
