- Reuse the original 24-pair draw, historical parent results, 24 completed Reflections and exact Curator
  output; run no new Ref/Cur inference.
- Recreate the exact 38-bullet candidate, including counters and IDs; do not edit any rule.
- Rerun every one of the 48 candidate Checker slots with v10 interactive-review prompt and executed_tools_v1
