  abort_on_operational_incomplete: true

operational_incomplete_policy: >-
  Model, transport, timeout, parsing, missing-artifact, repository-authority,
  or exhausted Agent-output-contract failures remain operationally incomplete.
  They are not converted to resolved, unresolved, tied, inverted, or INVALID.
  INVALID is reserved for a structurally valid candidate containing a bullet
  over 64 Checker tokens.

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 1750M
  controller_slice_time: "00:30:00"
  agent_time: "00:35:00"
  poll_interval_seconds: 30
  max_running_array_tasks: 0
  max_task_attempts: 3
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: verified-paired-repo-concern-playbook-formal24-8it-v4-20260920

success_criteria:
  - Use the complete frozen task-grouped split of 144 train pairs and 36 validation pairs from 57 tasks.
  - Keep every task wholly in train or validation; do not split pairs from one task across both.
  - Attempt eight candidate proposals with 24 training pairs selected per proposal.
  - Run two independent label-blind repository-aware Checker Agents for each evaluated pair.
  - Score only pair ordering: accept R and reject U is +1, the inverse is -1, and both ties are 0.
  - Run one paired repository-aware Reflection per selected pair and allow zero reusable concerns.
  - Keep outcome, pair side, Code/evaluator evidence, IDs, and counters outside the Checker boundary.
  - Curator receives paired Reflection summaries and manages binary high-level developer concerns without Level fields.
  - Keep every visible bullet at most 64 Checker tokens and the full visible playbook at most 2048 tokens.
  - Operational failures remain incomplete and never become scientific labels or INVALID candidates.
  - Begin search from the one-rule placeholder Seed; import only compatible completed Agent outputs, never prior candidates or optimizer progress.

