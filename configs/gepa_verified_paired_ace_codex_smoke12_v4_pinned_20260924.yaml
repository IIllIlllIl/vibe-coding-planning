models:
  checker:
    executor: mini_swe
    model: deepseek-v4-flash
    temperature: 0.0
    thinking: disabled
  reflector:
    executor: codex_cli
    codex_binary: ${HOME}/.local/lib/vibe-codex/0.155.1/bin/codex
    codex_version: 0.155.1
    model: gpt-5.6-terra
    reasoning_effort: max
  curator:
    executor: codex_cli
    codex_binary: ${HOME}/.local/lib/vibe-codex/0.155.1/bin/codex
    codex_version: 0.155.1
    model: gpt-5.6-sol
    reasoning_effort: high

repo_checker:
  output_contract: binary_v1
  review_only: true
  workdir: /testbed
  command_timeout_seconds: 1800
  source_access_policy: conservative_blacklist_v3
  history_policy: base_ancestor_bundle_v1
  masked_container_paths: [/opt/miniconda3/pkgs]

scoring: {correct_order: 1, inverted: -1, tied: 0, invalid: -100}
search:
  max_iterations: 1
  reflection_minibatch_size: 12
  max_metric_calls: 100
  seed: 42
  perfect_score: 1.0
  skip_perfect_score: false
reflection:
  rounds: 1
  output_contract: ace_v1
curation:
  evidence_contract: ace_v1
refiner:
  enabled: false
length:
  maximum_visible_tokens: 10000
  maximum_bullet_tokens: null
  harmful_pruning_weight: 2
budget:
  candidate_proposals: 1
  reflection_pairs_per_proposal: 12
  checker_agents_per_pair_evaluation: 2
  reflection_rounds_per_pair: 1
  projected_pair_metric_call_ceiling: 100
stopping:
  stop_after_candidate_proposals: 1
  abort_on_operational_incomplete: true
operational_incomplete_policy: >-
  Model, subscription, transport, timeout, parsing, missing-artifact,
  evidence-receipt, repository-authority, or exhausted Agent-output-contract
  failures remain operationally incomplete. Host validation retries invalid
  Agent artifacts; it does not rewrite them into scientific outcomes.

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  controller_slice_time: "00:30:00"
  agent_time: "00:35:00"
  poll_interval_seconds: 60
  max_running_array_tasks: 12
  max_task_attempts: 3
  task_output_grace_seconds: 120
  missing_task_grace_seconds: 300
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  job_name_prefix: verified-paired-ace-codex-smoke12-v4-pinned-20260924

success_criteria:
  - Import the exact completed paired Checker outputs from v1; do not resample them.
  - Verify Codex CLI 0.155.1 and its read-only sandbox before every inference call.
  - Every Reflector receives and returns the authoritative pair instance ID.
  - Every Codex Reflector and Curator returns the exact SHA-256 receipt for its evidence manifest.
  - Complete one fresh Reflector and Curator proposal from the same Seed and frozen minibatch.
  - Complete fresh evaluation of any proposed candidate without operationally incomplete cases.
  - Preserve raw Codex events, receipts, final messages, Host retries, candidates, counters, and pair-order scores.

checkpoint_import:
  source_run_dir: /scratch/users/twang/vibe-coding-planning/run_state/output/SWE-bench_Verified/gepa-paired-repo-concern-playbook-runs/ace-codex-smoke12-v1-20260924
  source_run_manifest_sha256: d1effbd613c5f90affafd3f92f1f56414f638d4bb270b118b2d01adcd75f21ce
  roles:
    - paired_repo_checker

readiness: {runnable: true, launched: false, missing: []}
launch_checks:
  - Confirm a clean committed worktree and no duplicate supervisor.
  - Verify the pinned Codex binary, version, sandbox preflight, and ChatGPT login.
  - Verify the frozen v1 run manifest and compatible completed Checker outputs.
  - Verify Iris storage, SIF authority, and prepared history bundles.
  - Verify generated Agent SBATCH requests remain one CPU and 4G.
audit_targets:
  - Confirm every imported Checker output has frozen source hashes and unchanged Agent evidence.
  - Confirm every completed Codex output has a matched Host evidence receipt.
  - Inspect Reflector contract compliance without Host rewriting Agent output.
  - Audit error-seeking bias, Curator operations, rule readability, and candidate scoring.
