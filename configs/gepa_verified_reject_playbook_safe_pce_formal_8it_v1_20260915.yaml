success_criteria:
- Start a fresh candidate tree from the atomic one-bullet v2 seed; do not resume or import candidates from an earlier run.
- 'Use exactly the frozen reliability-replaced formal400 membership: 320 train and 80 internal-validation cases.'
- Attempt eight GEPA candidate proposals with 32 selected Reflection cases each.
- Every selected case receives exactly one durable Reflection round and emits a structured reusable_concerns list.
- Checker sees only issue, Plan, and visible bullet text; IDs, counters, labels, repository, trajectories, and evaluator evidence remain hidden.
- Historical raw artifacts are hash-verified and materialized only into repository-free per-case Reflection bundles.
- Curator reads all 32 final case reflections from a read-only evidence bundle.
- Host scoring uses the explicit 1/0/-1/1 resolved-proxy table and reserves -100 only for candidate bullets over 64 Checker tokens.
- Every visible bullet remains at most 64 Checker tokens and the complete playbook remains at most 2048 Checker tokens.
- Operational failures remain incomplete and are never converted to unresolved, Bad, or INVALID.
- Agent completions, retries, counters, checkpoints, scores, fingerprints, and candidate lineage remain durable.
- The run stops after eight proposals or the 1600-call fail-safe, whichever occurs first.
