# Prepared CE-only replay for two shell-damaged Plans recovered from trajectories.
# This config does not authorize launch by itself.
mode: swe_verified_pce
purpose: verified_train10_shell_recovery_ce2

paths:
  dataset_snapshot: output/SWE-bench_Verified/swe-verified-pce-inputs/20260831_verified500_91aa3ed5
  image_manifest: output/SWE-bench_Verified/swe-verified-pce-inputs/20260831_verified500_91aa3ed5/recovered-plan-ce2-v1-20260911/images.json
  selection_manifest: configs/frozen_swe_verified_recovered_plan_ce/verified-train10-shell-recovery-ce2-v1-20260911/selection.json
  replay_manifest: configs/frozen_swe_verified_recovered_plan_ce/verified-train10-shell-recovery-ce2-v1-20260911/replay.json
  prompt_source_config: configs/polybench_pce_hpc_formal_clean_20260825.yaml
  run_dir: output/SWE-bench_Verified/swe-verified-pce-runs/development/recovered-plan-ce2-v1-20260911

# Retained for the shared PCE config contract. The replay controller preloads
# the frozen Plan checkpoint and never calls this model.
plan:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 0
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 3

code:
  model: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0
  max_steps: 0
  cost_limit: 0.0
  timeout: 1800
  max_attempts: 3

docker:
  workdir: /testbed
  timeout: 1800
  min_free_gb: 20
  max_cached_images: 75

container:
  runtime: apptainer
  module: tools/Apptainer
  sif_cache_dir: /scratch/users/${USER}/vibe-coding-planning/shared/sif-cache
  writable_tmpfs: true

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: "00:45:00"
  poll_interval_seconds: 300
  task_output_grace_seconds: 300
  missing_task_grace_seconds: 600
  max_task_attempts: 3
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: swe-verified-recovered-plan-ce2-v1-20260911
  worker_config_path: configs/swe_verified_recovered_plan_ce2_v1_20260911.yaml

evaluator:
  slurm_timeout_outcome: unknown

experiment_contract:
  cases: 2
  plan_agent_calls: 0
  checker_calls: 0
  code_agent_calls: 2
  historical_outcome_is_not_overwritten: true
  attribution: independent_code_sampling_from_recovered_plan
  stopping: both_cases_terminal_or_operational_attempts_exhausted
  operational_incomplete_is_not_unresolved: true
