# One-review external diagnostic for Behavioral C4 on frozen PolyBench PCE plans.
# It invokes the PCCE Checker only: no plan revision, Code, or Evaluate phase.
mode: polybench_pcce
purpose: behavioral_c4_polybench_pc_checker_only_balanced20

paths:
  source_snapshot: output/SWE-PolyBench/polybench-pce-inputs/20260814_python113_v11_8c7d9485d1d0
  image_manifest: output/SWE-PolyBench/polybench-pce-inputs/20260814_python113_v11_8c7d9485d1d0/images.json
  validation_snapshot: output/SWE-PolyBench/polybench-guideline-validation-datasets/20260826_python99_cleanpce_depcache_03619730229d
  pce_outcomes: output/SWE-PolyBench/polybench-guideline-validation-datasets/20260826_python99_cleanpce_depcache_03619730229d/paired_pce_outcomes.jsonl
  selection_manifest: configs/frozen_polybench_pc_quick/c4-balanced20-v1-20260831.json
  guideline: configs/frozen_guidelines/behavioral-formal-c4-v1-20260831/c4.md
  pce_runtime_config: configs/polybench_pce_hpc_dependency_cache_clean_20260825.yaml
  checker_runtime_config: configs/gepa_verified_rules.yaml
  run_dir: output/SWE-PolyBench/polybench-pc-checker-only-runs/development/c4-balanced20-v1-20260831

pcce:
  guideline_label: behavioral_formal_c4
  execution_mode: checker_only
  validation_file: validation.jsonl
  max_review_rejections: 1
  instance_ids: []

prompts:
  checker_system: |
    You are a software development assistant reviewing a proposed plan before
    implementation.

    Apply the candidate guideline to decide whether the submitted plan should
    proceed to implementation or should first be revised.

    Treat the candidate guideline as the sole source of plan-review methods,
    software-engineering principles, heuristics, and decision criteria. Do not
    add or rely on review guidance that is not stated in the candidate
    guideline. Use your general capabilities only to apply the guideline and
    operate the provided environment.

    You receive the issue, proposed plan, candidate guideline, and a disposable
    repository at the base commit. The repository is available at /testbed.
    Its final state is discarded after this review.

    When ready, submit the result with one final action in this form:
    ```bash
    cat <<'EOF'
    COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    {
      "should_proceed": false,
      "decision_reason": "...",
      "revision_feedback": "...",
      "repository_evidence": [
        {"path": "...", "symbol": "...", "finding": "..."}
      ]
    }
    EOF
    ```

    If should_proceed is true, revision_feedback must be an empty string. If
    should_proceed is false, revision_feedback must state what material problem
    the replacement plan needs to address. Submission finishes only when the
    executed command writes COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT as its first
    output line. Do not run another command after submitting.

  checker_instance: |
    <issue>
    {{task}}
    </issue>
    <plan>
    {{plan}}
    </plan>
    <candidate_guideline>
    {{candidate_guideline}}
    </candidate_guideline>
    {% if retry_feedback %}
    <retry_feedback>
    {{retry_feedback}}
    </retry_feedback>
    {% endif %}

hpc:
  submit: true
  partition: batch
  cpus_per_task: 1
  mem: 4G
  time: "00:45:00"
  poll_interval_seconds: 300
  task_output_grace_seconds: 300
  missing_task_grace_seconds: 600
  max_task_attempts: 3
  remote_env_file: ~/.config/vibe-coding-planning/deepseek.env
  python_module: lang/Python/3.11
  container_module: tools/Apptainer
  python_bin: python3
  job_name_prefix: polybench-pc-c4-balanced20
  worker_config_path: configs/polybench_pc_checker_only_c4_balanced20_v1_20260831.yaml
